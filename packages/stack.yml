# The product stack: every package that makes the desktop, installer and live
# system, grouped the way the build installs them. Each entry names the role
# and the package that fills it: a SynOS package built from packages/<name>/,
# or a package of the base archive (dracut, os-prober...). `only_base` limits
# an entry to one base, decided at render time (tools/render_manifest.py) —
# use it when the two bases genuinely need different packages. `optional:
# true` is for the narrower case only the target suite's own archive can
# settle: the package is attempted on every base it is listed for, but
# install_stack_group (mods/stack.sh), running inside the chroot with a real
# apt connection to that suite, drops it without failing the group if this
# suite's archive does not have it under that name at all — for a package
# folded into a sibling on some releases and not installable on its own
# there (dracut-install into dracut-core on Ubuntu jammy; dracut-live's
# dmsquash-live family into dracut-core on Ubuntu resolute). The manifest key
# packages.takeover is accepted for compatibility and ignored: every role is
# served from the SynOS repository.
groups:
  apt:
    description: Package source configuration and archive keyring
    install_recommends: false
    packages:
      - role: apt-config
        package: synos-apt-config
      - role: archive-keyring
        package: synos-archive-keyring
      - role: base-files
        package: base-files          # the archive's own package; os-release is owned by the brand kit
  live:
    description: Dracut Live stack
    install_recommends: false
    packages:
      - role: dracut
        package: dracut
      - role: dracut-core
        package: dracut-core
      - role: dracut-install
        package: dracut-install
        optional: true                # folded into dracut-core on some Ubuntu suites (jammy); not its own package there
      - role: dracut-live
        package: dracut-live          # carries the dmsquash-live family of modules on most suites...
        optional: true                # ...but not on Ubuntu resolute, where dracut-core already carries them and
                                       # dracut-live is not an installable package at all; mods/stack.sh's
                                       # ensure_dracut_live_modules is what actually guarantees the modules are
                                       # present, on every suite, regardless of which package would have provided them
      - role: live-layers
        package: synos-live-layers
      - role: discover
        package: discover
      - role: laptop-detect
        package: laptop-detect
      - role: os-prober
        package: os-prober
      - role: keyutils
        package: keyutils
  desktop:
    description: Desktop metapackages, theme, extensions, forks
    install_recommends: true
    exclude: [build-essential]      # dpkg-dev only recommends it; keep it out of the ISO
    packages:
      - role: desktop
        package: synos-desktop
      - role: desktop-apps
        package: synos-desktop-apps
      - role: gnome-extensions
        package: synos-gnome-extensions
      - role: appstore
        package: synos-appstore
      - role: theme
        package: synos-theme
      - role: wallpapers
        package: synos-wallpapers
      - role: fonts
        package: synos-fonts
      - role: no-snapd
        package: synos-no-snapd
      - role: session
        package: synos-session
      - role: software-properties
        package: synos-software-properties-common
        only_base: [ubuntu]           # makes Ubuntu's add-apt-repository work; Debian 13 has no software-properties
      - role: system-tweaks
        package: synos-system-tweaks
      - role: browser
        package: firefox-synos
      - role: ext-appindicator
        package: gnome-shell-extension-appindicator-synos
      - role: ext-dash-to-panel
        package: gnome-shell-extension-dash-to-panel-synos
      - role: ext-desktop-icons
        package: gnome-shell-extension-desktop-icons-ng-synos
      - role: plymouth-theme
        package: plymouth-synos
      - role: alsa-ucm
        package: alsa-ucm-conf-synos
      - role: firmware-sof
        package: firmware-sof-synos
  installer:
    description: Native declarative installer
    install_recommends: false
    packages:
      - role: installer
        package: synos-installer-beta
  snapshots:
    description: Btrfs snapshots manager payload (kept for Btrfs targets by the installer)
    install_recommends: false
    packages:
      - role: snapshots-manager
        package: synos-btrfs-snapshots-manager
  vmware:
    description: VMware guest integration (amd64 Live image only)
    install_recommends: true
    only_arch: [amd64]
    packages:
      - role: open-vm-tools
        package: open-vm-tools-desktop
