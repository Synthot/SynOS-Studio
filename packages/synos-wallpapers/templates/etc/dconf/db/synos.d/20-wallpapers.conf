# ${BRAND_NAME} default wallpaper (from the brand kit). The database directory
# keeps the upstream name until every dconf package is vendored (step 3).
[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/${BRAND_ID}/default.png'
picture-uri-dark='file:///usr/share/backgrounds/${BRAND_ID}/default.png'
picture-options='zoom'

[org/gnome/desktop/screensaver]
picture-uri='file:///usr/share/backgrounds/${BRAND_ID}/default.png'
