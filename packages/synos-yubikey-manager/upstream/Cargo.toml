[package]
name = "synos-yubikey-manager"
version = "2.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A GTK4/Libadwaita YubiKey security center for SynOS"
authors = ["AnduinOS Team <anduin@aiursoft.com>"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
# v1_5, not v1_6: the oldest supported base/suite (ubuntu/noble) ships
# libadwaita 1.5; nothing in this crate's code uses a v1_6-only binding.
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
tempfile = "3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
