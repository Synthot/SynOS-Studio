# tools/catalog_conformance.py's config. Copy to /etc/synos/conformance.yml
# (the units below point there) and fill in catalog_url and site_url at least.
#
# catalog_url is the Studio site's own exported catalog, not this
# repository's bundle-catalog/ — typically <site>/data/catalog.json, the
# file tools/export_catalog.py's bundle_catalog key becomes once the front
# end deploys it. Used by both `build` and `check` to enumerate entries;
# `check` also reads its embedded files directly (a generation bug there is
# exactly what `check` cannot catch and `build` exists to).
catalog_url: https://studio.example/data/catalog.json

# `build` only, required: the real Studio page itself — the deployed site,
# or a locally served release (e.g. a checkout of SynOS-Studio built with
# its own build.py and served with `python3 -m http.server`). `build`
# connects to this URL under headless Chrome and never builds or serves a
# site itself (tools/devtools_browser.py). google-chrome or chromium must
# be on PATH; missing, `build` skips every entry with a printed reason
# rather than failing.
site_url: https://studio.example

# Where downloaded bundles, unpacked launcher runs, and the two report
# files (build-report.json/build-summary.txt, check-report.json/check-summary.txt)
# are kept between runs. Owned by the service user (see README below).
workdir: /var/lib/synos-conformance

# Disk guard for `build` only (docs/BUILD_MATRIX.md's own thresholds):
# this checkout's own free space, and the container runtime's storage.
min_free_gb: 40
min_store_gb: 30

# `build` only: how many catalog entries one run attempts (a full pass over
# fifty-odd entries is the better part of a day; the systemd timer below
# runs this rarely) and the per-entry timeout (the launcher's own update
# check and image pull count against this too, since both now run for real).
max_builds_per_run: 5
build_timeout_minutes: 90

# `build` only: how many entries to build at once. "1" (default) or "auto"
# to derive the safe count from this machine's own disk, memory and CPUs
# (tools/host_resources.py); an explicit number above what "auto" would
# pick is refused with the reason. Above 1, each worker gets its own podman
# storage root (a subdirectory under workdir) unless container_root below
# is set, so two workers building the same base/suite never collide on the
# launcher's own cache volume name (docs/BUILD_MATRIX.md).
jobs: "1"

# `build` only: run tools/smoke_test.py on every entry that builds.
smoke: true

# `build` only, optional: a single builder image for every entry instead of
# the launcher resolving one itself (SYNOS_BUILDER_IMAGE). Leave null to
# let the launcher do exactly what a person's own run would.
image: null

# `build` only, optional and rare: pins the launcher to build its engine
# image from a local checkout (SYNOS_ENGINE_SOURCE) instead of pulling the
# published one or building from the public archive. Only for testing
# unreleased engine changes before they are published; leave null so a run
# proves what a person gets today, not what this checkout happens to hold.
engine_source: null

# `build` only, podman only, both optional: where podman keeps images,
# layers and the chroot for every entry (default: podman's own storage) and
# its small state directory (default: podman's own). min_store_gb above is
# then measured here instead of podman's default. Refused for docker, whose
# storage is one setting for the whole daemon (docs/BUNDLE.md).
container_root: null
container_runroot: null

# Optional: POST {"report": ..., "diff": ...} here after every run (build
# and check both). No email or notification service is invented here —
# point this at whatever already receives webhooks (a chat incoming
# webhook, a small collector of your own). Leave null to only write the
# report files under workdir.
report_url: null

# `build` only, optional: where to send workdir/build-status.json — the
# small, public file the Studio page fetches to show each bundle's "built
# and safe to use" badge (tools/build_status.py, tools/status_uploader.py).
# Leave the whole section out (or leave it commented, as below) to build
# the file locally and never upload it. See docs/BUILD_MATRIX.md's
# "Publishing the build-status badge" for the full shape and how to check
# a delivered file arrived. NEVER fill this in inside a copy of this
# example that is committed anywhere; the real values belong only in the
# private /etc/synos/conformance.yml a service user's process reads.
#
# upload:
#   protocol: sftp                # sftp | scp | ftps | ftp (ftp refused unless allow_insecure_ftp: true)
#   host: studio.example
#   port: 22
#   username: synos-conformance-upload
#   password: null                 # or key_path below; ssh password auth also needs `sshpass` installed
#   key_path: /etc/synos/conformance-upload-key
#   remote_path: /var/www/studio/data/build-status.json
#   allow_insecure_ftp: false
#   retries: 3
#   retry_backoff_s: 5

# `build` only: free a successful entry's heavy directories (the unpacked
# bundle, its build tree, the multi-GB ISO) as soon as that entry
# finishes, keeping the small evidence (checksum, size, build log, smoke
# result) — docs/BUILD_MATRIX.md's "Freeing disk as it goes". A failed or
# skipped entry always keeps everything, regardless of this setting. Set
# to false (or pass --no-cleanup on the command line for one run) to keep
# every entry's full working directory, e.g. for a debugging run.
cleanup: true
