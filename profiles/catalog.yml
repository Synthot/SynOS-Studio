  - {name: eid-mw, category: Security, summary: Belgian eID middleware}
  - {name: cockpit, category: Server, summary: Web administration on port 9090}
  - {name: cockpit-machines, category: Server, summary: Virtual machines in Cockpit}
  - {name: nginx, category: Server, summary: Web server and reverse proxy}
  - {name: samba, category: Server, summary: Windows-compatible file sharing}
  - {name: nfs-kernel-server, category: Server, summary: NFS file sharing}
  - {name: mariadb-server, category: Server, summary: MariaDB database}
  - {name: postgresql, category: Server, summary: PostgreSQL database}
