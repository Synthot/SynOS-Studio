# Text and catalog data the configurator shows. Everything structural
# (bases, profiles, bundles, regions, package maps, stack roles, schemas)
# is read from the repository by tools/export_catalog.py; this file
# only carries descriptions and the searchable package catalog.
bundles:
  desktop-core: Desktop shell, firmware, translations, hardening baseline (always on)
  office: Office suite, PDF, calendar
  communication: Mail and browser
  remote-access: RDP and VDI clients
  printing: CUPS and driverless printing
  vpn: WireGuard and OpenVPN
  smartcard: OpenSC, PC/SC, eID readers
  directory: Domain join stack
  compliance: OpenSCAP and content
  containers: Podman and Buildah
  build-tools: Compilers, CMake, debugger
  media: Video and image tools
  web-admin: Cockpit web administration (services, storage, containers, terminal)
  virtualization: KVM virtual machines with libvirt
  ai-dev: PyTorch, Python tooling and llama.cpp for local model work
  yocto-build: Host tools required to build embedded images with the Yocto Project / OpenEmbedded (BitBake and friends), plus practical extras (rsync, ccache, QEMU for runqemu, and the like)
  yocto-build-docs: Packages to build the Yocto Project's own documentation, including PDFs (large — LaTeX and a full font set)
  audio-production: Ardour and a PipeWire studio setup (JACK compatibility, patchbay, MIDI bridge, plugins, a drum machine)
  video-editing: Kdenlive, ffmpeg and VA-API/VDPAU hardware video acceleration
  photography: RAW processing (darktable, RawTherapee), colour management and display calibration (ArgyllCMS, DisplayCAL) and tethered shooting
  cad-3d-printing: FreeCAD, OpenSCAD and a slicer (PrusaSlicer on Ubuntu, Cura on Debian)
  data-science: Jupyter Notebook and the Python scientific stack (NumPy, SciPy, pandas, scikit-learn, Matplotlib, seaborn)
  security-research: Network and web analysis tools (nmap, Wireshark, sqlmap and friends) for lawful, authorised testing only
  retro-gaming: RetroArch with several libretro cores, plus joystick/gamepad tools

compliance:
  - {id: none, name: None}
  - {id: cis-level1, name: CIS Level 1}
  - {id: cis-level2, name: CIS Level 2}
  - {id: anssi-bp028-intermediate, name: ANSSI BP-028 intermediate (FR)}
  - {id: anssi-bp028-enhanced, name: ANSSI BP-028 enhanced (FR)}
  - {id: bsi-sys-1-3, name: BSI SYS.1.3 (DE)}
  - {id: bio, name: BIO (NL)}
  - {id: ncsc-eud, name: NCSC EUD (UK)}
  - {id: itsg-33, name: ITSG-33 (CA)}
  - {id: nist-800-171, name: NIST 800-171 (US)}

# Recommended packages, shown first on the applications screen: servers,
# command-line tools and other packages with no desktop entry, plus a few
# well-known applications. The full application list is generated from the
# base archives into catalog.apps.yml by tools/build_catalog.py.
packages:
  - {name: libreoffice, category: Office, summary: Office suite}
  - {name: gnucash, category: Finance, summary: Double-entry accounting}
  - {name: keepassxc, category: Security, summary: Password manager}
  - {name: opensc, category: Security, summary: Smart card and eID middleware}
  - {name: remmina, category: Remote, summary: RDP, VNC and SSH client}
  - {name: freerdp3-x11, category: Remote, summary: RDP client}
  - {name: thunderbird, category: Mail, summary: Mail client}
  - {name: evolution, category: Mail, summary: Mail and calendar with Exchange support}
  - {name: nextcloud-desktop, category: Files, summary: Nextcloud sync client}
  - {name: wireguard-tools, category: VPN, summary: WireGuard VPN}
  - {name: gimp, category: Media, summary: Image editor}
  - {name: inkscape, category: Media, summary: Vector editor}
  - {name: vlc, category: Media, summary: Media player}
  - {name: obs-studio, category: Media, summary: Screen recording}
  - {name: code-oss, category: Developer, summary: Code editor}
  - {name: git, category: Developer, summary: Version control}
  - {name: podman, category: Developer, summary: Containers without a daemon}
  - {name: python3, category: Developer, summary: Python runtime}
  - {name: gnome-boxes, category: Virtualisation, summary: Simple virtual machines}
  - {name: virt-manager, category: Virtualisation, summary: KVM management}
  - {name: qgis, category: GIS, summary: Geographic information system}
  - {name: scribus, category: Publishing, summary: Desktop publishing}
  - {name: zotero, category: Research, summary: Reference manager (Flatpak)}
  - {name: eid-mw, category: Security, summary: Belgian eID middleware}
  - {name: cockpit, category: Server, summary: Web administration on port 9090}
  - {name: cockpit-machines, category: Server, summary: Virtual machines in Cockpit}
  - {name: nginx, category: Server, summary: Web server and reverse proxy}
  - {name: samba, category: Server, summary: Windows-compatible file sharing}
  - {name: nfs-kernel-server, category: Server, summary: NFS file sharing}
  - {name: mariadb-server, category: Server, summary: MariaDB database}
  - {name: postgresql, category: Server, summary: PostgreSQL database}
  - {name: docker.io, category: Server, summary: Docker engine (podman is included by default)}
  - {name: fail2ban, category: Security, summary: Bans hosts that fail to log in}
  - {name: borgbackup, category: Server, summary: Deduplicating backups}
  - {name: llama.cpp, category: AI, summary: Run GGUF models locally from the command line}
  - {name: python3-torch, category: AI, summary: PyTorch (CPU build from the archive)}
  - {name: nvidia-cuda-toolkit, category: AI, summary: CUDA compiler and libraries}
  - {name: rocminfo, category: AI, summary: ROCm device information}

# Containers offered as system services (software.services in a profile). The
# page picks the image for the chosen GPU; gpu_required lists the GPUs a
# service cannot run without.
services:
  - id: ollama
    title: Ollama
    summary: Local inference with a command line and an API on port 11434; pulls models on demand
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    gpu: true
    images: {default: docker.io/ollama/ollama:latest, amd: docker.io/ollama/ollama:rocm}
  - id: open-webui
    title: Open WebUI
    summary: Chat interface for Ollama on port 3000, in the browser
    ports: ["3000:8080"]
    volumes: ["open-webui:/app/backend/data"]
    env: {OLLAMA_BASE_URL: "http://host.containers.internal:11434"}
    gpu: false
    images: {default: ghcr.io/open-webui/open-webui:main}
    needs: [ollama]
  - id: vllm
    title: vLLM server
    summary: OpenAI-compatible inference server on port 8000 for production workloads (NVIDIA or AMD)
    ports: ["8000:8000"]
    volumes: ["vllm:/root/.cache/huggingface"]
    gpu: true
    gpu_required: [nvidia, amd]
    exec: "--model Qwen/Qwen2.5-1.5B-Instruct"
    images: {nvidia: docker.io/vllm/vllm-openai:latest, amd: docker.io/rocm/vllm:latest}
  # Appliance services (bundle-catalog, docs/BUNDLE.md "The bundle catalog"):
  # none of these need a GPU. Image tags are pinned and were checked on
  # Docker Hub's tag listing for the repository named.
  - id: nginx
    title: Nginx
    summary: Web server and reverse proxy on ports 80 and 443; the leanest and fastest of the three web server appliances
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/usr/share/nginx/html:ro", "/etc/nginx/conf.d/site.conf:/etc/nginx/conf.d/default.conf:ro", "/etc/nginx/certs:/etc/nginx/certs:ro"]
    gpu: false
    images: {default: docker.io/library/nginx:1.31.2}
  - id: apache
    title: Apache httpd
    summary: Web server and reverse proxy on ports 80 and 443; the traditional, most broadly documented and module-rich of the three
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/usr/local/apache2/htdocs:ro", "/etc/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro", "/etc/apache/certs:/etc/apache/certs:ro"]
    gpu: false
    images: {default: docker.io/library/httpd:2.4.68}
  - id: caddy
    title: Caddy
    summary: Web server on ports 80 and 443 that requests and renews HTTPS certificates for a real domain automatically
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/srv/www:ro", "/etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    gpu: false
    images: {default: docker.io/library/caddy:2.11.4}
  - id: registry
    title: OCI Registry
    summary: Docker/OCI image registry on port 5000 with HTTP basic authentication
    ports: ["5000:5000"]
    volumes: ["registry-data:/var/lib/registry", "/etc/registry/config.yml:/etc/distribution/config.yml:ro", "/etc/registry/htpasswd:/auth/htpasswd:ro"]
    gpu: false
    images: {default: docker.io/library/registry:3.1.1}
  - id: gitea
    title: Gitea
    summary: Self-hosted Git with a web UI, issues and pull requests, on port 3000 (SQLite, no external database)
    ports: ["3000:3000", "2222:22"]
    volumes: ["gitea-data:/data", "/etc/gitea/app.ini:/data/gitea/conf/app.ini:ro"]
    env: {USER_UID: "1000", USER_GID: "1000"}
    gpu: false
    images: {default: docker.io/gitea/gitea:1.27.3}
  - id: jellyfin
    title: Jellyfin
    summary: Media server for movies, TV and music on port 8096, pointed at a media folder
    ports: ["8096:8096"]
    volumes: ["jellyfin-config:/config", "jellyfin-cache:/cache", "/srv/media:/media"]
    gpu: false
    images: {default: docker.io/jellyfin/jellyfin:12.1}
  - id: prometheus
    title: Prometheus
    summary: Metrics collection and storage on port 9090, scraping itself out of the box
    ports: ["9090:9090"]
    volumes: ["prometheus-data:/prometheus", "/etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    gpu: false
    images: {default: docker.io/prom/prometheus:v3.13.3}
  - id: grafana
    title: Grafana
    summary: Dashboards on port 3000, pre-wired to the Prometheus appliance service as its default data source
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "/etc/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro"]
    gpu: false
    images: {default: docker.io/grafana/grafana:13.2.2}
    needs: [prometheus]
  - id: postgres
    title: PostgreSQL
    summary: PostgreSQL database; the superuser password is read from a file this profile does not ship, so the service fails closed until one is created
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "/etc/postgres/superuser-password:/run/secrets/postgres-superuser-password:ro"]
    env: {POSTGRES_PASSWORD_FILE: "/run/secrets/postgres-superuser-password"}
    gpu: false
    images: {default: docker.io/library/postgres:17.11}
  - id: homeassistant
    title: Home Assistant
    summary: Home automation hub on port 8123; its own onboarding wizard creates the first (administrator) account
    ports: ["8123:8123"]
    volumes: ["homeassistant-config:/config"]
    gpu: false
    images: {default: docker.io/homeassistant/home-assistant:2026.9.3}
  - id: pihole
    title: Pi-hole
    summary: Network-wide ad and tracker blocking over DNS on port 53; the web UI's password is generated at random on first start
    ports: ["53:53/tcp", "53:53/udp", "80:80"]
    volumes: ["pihole-etc:/etc/pihole", "pihole-dnsmasq:/etc/dnsmasq.d"]
    env: {TZ: "UTC"}
    gpu: false
    images: {default: docker.io/pihole/pihole:2026.09.0}
  - id: nextcloud
    title: Nextcloud
    summary: Personal cloud for files, contacts and calendars on port 80, using SQLite so there is no separate database
    ports: ["80:80"]
    volumes: ["nextcloud-data:/var/www/html"]
    env: {SQLITE_DATABASE: "nextcloud"}
    gpu: false
    images: {default: docker.io/library/nextcloud:35.0.0-apache}
  - id: vaultwarden
    title: Vaultwarden
    summary: Bitwarden-compatible password manager on port 80; sign-ups disabled by default and must sit behind TLS before it is exposed
    ports: ["80:80"]
    volumes: ["vaultwarden-data:/data"]
    env: {SIGNUPS_ALLOWED: "false"}
    gpu: false
    images: {default: docker.io/vaultwarden/server:1.37.3}
  - id: portainer
    title: Portainer
    summary: Container management web UI on port 9443 for this machine's own containers; a random setup token gates the first admin account
    ports: ["9443:9443"]
    volumes: ["portainer-data:/data", "/run/podman/podman.sock:/var/run/docker.sock"]
    gpu: false
    images: {default: docker.io/portainer/portainer-ce:2.45.1}
  - id: uptime-kuma
    title: Uptime Kuma
    summary: Uptime and status-page monitoring on port 3001; its own setup screen creates the one admin account
    ports: ["3001:3001"]
    volumes: ["uptime-kuma-data:/app/data"]
    gpu: false
    images: {default: docker.io/louislam/uptime-kuma:2.5.5}
  - id: syncthing
    title: Syncthing
    summary: Peer-to-peer file synchronisation; sync (22000, TCP/UDP) and discovery (21027/UDP) are open, the unauthenticated web GUI (8384) is not
    ports: ["8384:8384", "22000:22000/tcp", "22000:22000/udp", "21027:21027/udp"]
    volumes: ["syncthing-config:/var/syncthing/config", "syncthing-data:/var/syncthing/data"]
    gpu: false
    images: {default: docker.io/syncthing/syncthing:2.1.5}
  - id: minio
    title: MinIO
    summary: S3-compatible object storage, API on port 9000 and console on port 9001; falls back to minioadmin:minioadmin if no root credentials are set
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    exec: "server /data --console-address :9001"
    gpu: false
    images: {default: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772}
  - id: n8n
    title: n8n
    summary: Workflow automation on port 5678 with a large library of ready integrations; its own setup screen creates the first (owner) account
    ports: ["5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n"]
    gpu: false
    images: {default: docker.io/n8nio/n8n:2.41.0}
  - id: wg-easy
    title: wg-easy
    summary: WireGuard VPN server with a peer-management web UI; the VPN itself (51820/udp) is open, its account-claiming web UI (51821) is not
    ports: ["51820:51820/udp", "51821:51821"]
    volumes: ["wg-easy-data:/etc/wireguard"]
    env: {WG_HOST: "192.0.2.1"}
    cap_add: [NET_ADMIN]
    gpu: false
    images: {default: ghcr.io/wg-easy/wg-easy:15.4.0}
  - id: clickhouse
    title: ClickHouse
    summary: Column-oriented analytics database, HTTP on port 8123 and its native protocol on 9000; the default user is loopback-only until a password is set
    ports: ["8123:8123", "9000:9000"]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "/etc/clickhouse/password:/run/secrets/clickhouse-password:ro"]
    env: {CLICKHOUSE_PASSWORD_FILE: "/run/secrets/clickhouse-password"}
    gpu: false
    images: {default: docker.io/clickhouse/clickhouse-server:25.8.33}
  - id: influxdb
    title: InfluxDB
    summary: Time-series database with an HTTP API and UI on port 8086; fails to start until an admin password file is created
    ports: ["8086:8086"]
    volumes: ["influxdb-data:/var/lib/influxdb2", "/etc/influxdb/admin-password:/run/secrets/influxdb-admin-password:ro"]
    env: {DOCKER_INFLUXDB_INIT_MODE: "setup", DOCKER_INFLUXDB_INIT_USERNAME: "admin", DOCKER_INFLUXDB_INIT_PASSWORD_FILE: "/run/secrets/influxdb-admin-password", DOCKER_INFLUXDB_INIT_ORG: "synos", DOCKER_INFLUXDB_INIT_BUCKET: "metrics"}
    gpu: false
    images: {default: docker.io/library/influxdb:2.7.12}
  - id: cassandra
    title: Cassandra
    summary: Wide-column store on CQL port 9042, a single node that can grow into a cluster; ships with no authentication until first_boot turns it on
    ports: ["9042:9042"]
    volumes: ["cassandra-data:/var/lib/cassandra"]
    gpu: false
    images: {default: docker.io/library/cassandra:5.0.6}
  - id: cockroach
    title: CockroachDB
    summary: Distributed SQL database speaking the PostgreSQL wire protocol, SQL on port 26257 and its admin UI on 8080, secure mode with self-generated certificates
    ports: ["26257:26257", "8080:8080"]
    volumes: ["cockroach-certs:/cockroach/certs", "cockroach-data:/cockroach/cockroach-data"]
    exec: "start-single-node --certs-dir=/cockroach/certs --store=/cockroach/cockroach-data"
    gpu: false
    images: {default: docker.io/cockroachdb/cockroach:v25.1.8}
  - id: couchdb
    title: CouchDB
    summary: Document database over its own HTTP API on port 5984; refuses "Admin Party" mode and fails to start until an admin account file is created
    ports: ["5984:5984"]
    volumes: ["couchdb-data:/opt/couchdb/data", "/etc/couchdb/admins.ini:/opt/couchdb/etc/local.d/admins.ini:ro"]
    gpu: false
    images: {default: docker.io/library/couchdb:3.5.0}
  - id: valkey
    title: Valkey
    summary: In-memory data structure store on port 6379, the BSD-licensed fork shipped in place of the software it forked from; fails to start until a real ACL file exists
    ports: ["6379:6379"]
    volumes: ["valkey-data:/data", "/etc/valkey/users.acl:/etc/valkey/users.acl:ro"]
    exec: "--protected-mode yes --aclfile /etc/valkey/users.acl"
    gpu: false
    images: {default: docker.io/valkey/valkey:8.1.10}
  - id: mongodb
    title: MongoDB
    summary: MongoDB Community Server (never Enterprise), document database on port 27017; fails to start until a root password file is created
    ports: ["27017:27017"]
    volumes: ["mongodb-data:/data/db", "/etc/mongodb/root-password:/run/secrets/mongo-root-password:ro"]
    env: {MONGO_INITDB_ROOT_USERNAME: "root", MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/secrets/mongo-root-password"}
    gpu: false
    images: {default: docker.io/library/mongo:8.0.12}
  - id: neo4j
    title: Neo4j
    summary: Neo4j Community Edition (never Enterprise), graph database with its browser/HTTP interface on port 7474 and Bolt on 7687; fails to start until an auth file is created
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j-data:/data", "/etc/neo4j/auth:/run/secrets/neo4j-auth:ro"]
    env: {NEO4J_AUTH_FILE: "/run/secrets/neo4j-auth"}
    gpu: false
    images: {default: docker.io/library/neo4j:5.26.14}
  - id: milvus
    title: Milvus
    summary: Vector database for similarity search, standalone with embedded etcd and local storage on gRPC port 19530; the most memory-hungry appliance in this catalog
    ports: ["19530:19530", "9091:9091"]
    volumes: ["milvus-data:/var/lib/milvus", "/etc/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro", "/etc/milvus/user.yaml:/milvus/configs/user.yaml:ro"]
    env: {ETCD_USE_EMBED: "true", ETCD_DATA_DIR: "/var/lib/milvus/etcd", ETCD_CONFIG_PATH: "/milvus/configs/embedEtcd.yaml", COMMON_STORAGETYPE: "local", DEPLOY_MODE: "STANDALONE"}
    exec: "milvus run standalone"
    gpu: false
    images: {default: docker.io/milvusdb/milvus:v3.0.2}
  - id: kafka
    title: Apache Kafka
    summary: Single-broker event streaming in KRaft mode on port 9092, no separate ZooKeeper ensemble needed
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    env: {KAFKA_NODE_ID: "1", KAFKA_PROCESS_ROLES: "broker,controller", KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092", KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER", KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093", KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT", KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"}
    gpu: false
    images: {default: docker.io/apache/kafka:4.3.1}
  - id: jobmanager
    title: Flink Job Manager
    summary: Apache Flink job manager and REST API on port 8081, submitting work to its task manager
    ports: ["8081:8081", "6123:6123", "6124:6124"]
    volumes: ["flink-jm-data:/opt/flink/log"]
    env: {JOB_MANAGER_RPC_ADDRESS: "host.containers.internal"}
    gpu: false
    images: {default: docker.io/library/flink:2.3.0-scala_2.12-java17}
  - id: taskmanager
    title: Flink Task Manager
    summary: Apache Flink task manager that registers with the job manager appliance service and runs its work
    ports: ["6121:6121", "6122:6122"]
    volumes: ["flink-tm-data:/opt/flink/log"]
    env: {JOB_MANAGER_RPC_ADDRESS: "host.containers.internal", TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "2"}
    gpu: false
    images: {default: docker.io/library/flink:2.3.0-scala_2.12-java17}
    needs: [jobmanager]
  - id: zookeeper
    title: Apache ZooKeeper
    summary: Coordination ensemble on port 2181 for stacks that still need one; Kafka itself no longer does
    ports: ["2181:2181"]
    volumes: ["zookeeper-data:/data", "zookeeper-datalog:/datalog"]
    gpu: false
    images: {default: docker.io/library/zookeeper:3.9.5}
  - id: keycloak
    title: Keycloak
    summary: Identity and single sign-on on port 8080, in start-dev mode with its embedded database; no admin account exists until one is created locally
    ports: ["8080:8080"]
    volumes: ["keycloak-data:/opt/keycloak/data"]
    env: {KC_HOSTNAME_STRICT: "false"}
    gpu: false
    images: {default: quay.io/keycloak/keycloak:26.7.4}
  - id: openbao
    title: OpenBao
    summary: Secret manager on port 8200 (the open-source fork of HashiCorp Vault); ships sealed and uninitialised, with no keys of its own
    ports: ["8200:8200"]
    volumes: ["openbao-data:/openbao/file"]
    env: {BAO_LOCAL_CONFIG: '{"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"storage":{"raft":{"path":"/openbao/file","node_id":"node1"}},"cluster_addr":"http://127.0.0.1:8201","api_addr":"http://127.0.0.1:8200","disable_mlock":true}'}
    gpu: false
    images: {default: docker.io/openbao/openbao:2.6.2}
  - id: envoy
    title: Envoy
    summary: Edge proxy and load balancer on port 10000, its admin interface bound to loopback inside the container and never published
    ports: ["10000:10000"]
    volumes: ["/etc/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    gpu: false
    images: {default: docker.io/envoyproxy/envoy:v1.39.1}
  - id: pdns
    title: PowerDNS Authoritative Server
    summary: Authoritative DNS on port 53 for a placeholder zone; its zone-editing HTTP API ships turned off
    ports: ["53:53/tcp", "53:53/udp"]
    volumes: ["/etc/powerdns/pdns.conf:/etc/powerdns/pdns.conf:ro", "/etc/powerdns/named.conf:/etc/powerdns/named.conf:ro", "/etc/powerdns/example.com.zone:/etc/powerdns/example.com.zone:ro"]
    gpu: false
    images: {default: docker.io/powerdns/pdns-auth-49:4.9.17}
  - id: ray-head
    title: Ray head node
    summary: Distributed Python and machine-learning compute with its dashboard on port 8265; the dashboard and client ports run arbitrary code with no authentication
    ports: ["6379:6379", "8265:8265", "10001:10001"]
    volumes: ["ray-data:/tmp/ray"]
    gpu: false
    images: {default: docker.io/rayproject/ray:2.58.0-py311-cpu}
  - id: gitlab
    title: GitLab Community Edition
    summary: Self-hosted DevOps platform on ports 80, 443 and 2222 for git over SSH; heavy, needing at least 8 GB of memory and about 40 GB of disk
    ports: ["80:80", "443:443", "2222:22"]
    volumes: ["gitlab-config:/etc/gitlab", "/etc/gitlab/gitlab.rb:/etc/gitlab/gitlab.rb:ro", "gitlab-logs:/var/log/gitlab", "gitlab-data:/var/opt/gitlab"]
    gpu: false
    images: {default: docker.io/gitlab/gitlab-ce:19.4.0-ce.0}

# GPU compute stacks a profile may ship (hardware.gpu); what each adds is in the
# bases' package maps (gpu-nvidia, gpu-amd, gpu-intel).
gpus:
  - id: none
    name: No GPU stack
    summary: "Open drivers only. NVIDIA can still be added later by the installer's driver step."
  - id: nvidia
    name: NVIDIA
    summary: "Open kernel driver, CUDA toolkit and the container toolkit from NVIDIA's repository."
  - id: amd
    name: AMD Radeon
    summary: "In-kernel driver and ROCm tools; the ROCm runtime runs inside the containers."
  - id: intel
    name: Intel Arc
    summary: "OpenCL and Level Zero runtime on Ubuntu; Debian ships the loader only."
