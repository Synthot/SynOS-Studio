  - {name: gnucash, category: Finance, summary: Double-entry accounting}
  - {name: keepassxc, category: Security, summary: Password manager}
  - {name: opensc, category: Security, summary: Smart card and eID middleware}
  - {name: remmina, category: Remote, summary: RDP, VNC and SSH client}
  - {name: freerdp3-x11, category: Remote, summary: RDP client}
  - {name: thunderbird, category: Mail, summary: Mail client}
  - {name: evolution, category: Mail, summary: Mail and calendar with Exchange support}
  - {name: nextcloud-desktop, category: Files, summary: Nextcloud sync client}
  - {name: wireguard-tools, category: VPN, summary: WireGuard VPN}
  - {name: gimp, category: Media, summary: Image editor}
  - {name: inkscape, category: Media, summary: Vector editor}
  - {name: vlc, category: Media, summary: Media player}
  - {name: obs-studio, category: Media, summary: Screen recording}
  - {name: code-oss, category: Developer, summary: Code editor}
  - {name: git, category: Developer, summary: Version control}
  - {name: podman, category: Developer, summary: Containers without a daemon}
  - {name: python3, category: Developer, summary: Python runtime}
  - {name: gnome-boxes, category: Virtualisation, summary: Simple virtual machines}
  - {name: virt-manager, category: Virtualisation, summary: KVM management}
  - {name: qgis, category: GIS, summary: Geographic information system}
  - {name: scribus, category: Publishing, summary: Desktop publishing}
  - {name: zotero, category: Research, summary: Reference manager (Flatpak)}
  - {name: eid-mw, category: Security, summary: Belgian eID middleware}
  - {name: cockpit, category: Server, summary: Web administration on port 9090}
  - {name: cockpit-machines, category: Server, summary: Virtual machines in Cockpit}
  - {name: nginx, category: Server, summary: Web server and reverse proxy}
  - {name: samba, category: Server, summary: Windows-compatible file sharing}
  - {name: nfs-kernel-server, category: Server, summary: NFS file sharing}
  - {name: mariadb-server, category: Server, summary: MariaDB database}
  - {name: postgresql, category: Server, summary: PostgreSQL database}
  - {name: docker.io, category: Server, summary: Docker engine (podman is included by default)}
  - {name: fail2ban, category: Security, summary: Bans hosts that fail to log in}
