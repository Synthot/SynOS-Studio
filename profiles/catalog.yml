# Containers offered as system services (software.services in a profile). The
# page picks the image for the chosen GPU; gpu_required lists the GPUs a
# service cannot run without.
services:
  - id: ollama
    title: Ollama
    summary: Local inference with a command line and an API on port 11434; pulls models on demand
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    gpu: true
    images: {default: docker.io/ollama/ollama:latest, amd: docker.io/ollama/ollama:rocm}
  - id: open-webui
    title: Open WebUI
    summary: Chat interface for Ollama on port 3000, in the browser
    ports: ["3000:8080"]
    volumes: ["open-webui:/app/backend/data"]
    env: {OLLAMA_BASE_URL: "http://host.containers.internal:11434"}
    gpu: false
    images: {default: ghcr.io/open-webui/open-webui:main}
    needs: [ollama]
  - id: vllm
    title: vLLM server
    summary: OpenAI-compatible inference server on port 8000 for production workloads (NVIDIA or AMD)
    ports: ["8000:8000"]
    volumes: ["vllm:/root/.cache/huggingface"]
    gpu: true
    gpu_required: [nvidia, amd]
    exec: "--model Qwen/Qwen2.5-1.5B-Instruct"
    images: {nvidia: docker.io/vllm/vllm-openai:latest, amd: docker.io/rocm/vllm:latest}
  # Appliance services (bundle-catalog, docs/BUNDLE.md "The bundle catalog"):
  # none of these need a GPU. Image tags are pinned and were checked on
  # Docker Hub's tag listing for the repository named.
  - id: nginx
    title: Nginx
    summary: Web server and reverse proxy on ports 80 and 443; the leanest and fastest of the three web server appliances
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/usr/share/nginx/html:ro", "/etc/nginx/conf.d/site.conf:/etc/nginx/conf.d/default.conf:ro", "/etc/nginx/certs:/etc/nginx/certs:ro"]
    gpu: false
    images: {default: docker.io/library/nginx:1.31.2}
  - id: apache
    title: Apache httpd
    summary: Web server and reverse proxy on ports 80 and 443; the traditional, most broadly documented and module-rich of the three
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/usr/local/apache2/htdocs:ro", "/etc/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro", "/etc/apache/certs:/etc/apache/certs:ro"]
    gpu: false
    images: {default: docker.io/library/httpd:2.4.68}
  - id: caddy
    title: Caddy
    summary: Web server on ports 80 and 443 that requests and renews HTTPS certificates for a real domain automatically
    ports: ["80:80", "443:443"]
    volumes: ["/srv/www:/srv/www:ro", "/etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    gpu: false
    images: {default: docker.io/library/caddy:2.11.4}
  - id: registry
    title: OCI Registry
    summary: Docker/OCI image registry on port 5000 with HTTP basic authentication
    ports: ["5000:5000"]
    volumes: ["registry-data:/var/lib/registry", "/etc/registry/config.yml:/etc/distribution/config.yml:ro", "/etc/registry/htpasswd:/auth/htpasswd:ro"]
    gpu: false
    images: {default: docker.io/library/registry:3.1.1}
  - id: gitea
    title: Gitea
    summary: Self-hosted Git with a web UI, issues and pull requests, on port 3000 (SQLite, no external database)
    ports: ["3000:3000", "2222:22"]
    volumes: ["gitea-data:/data", "/etc/gitea/app.ini:/data/gitea/conf/app.ini:ro"]
    env: {USER_UID: "1000", USER_GID: "1000"}
    gpu: false
    images: {default: docker.io/gitea/gitea:1.27.3}
  - id: jellyfin
    title: Jellyfin
    summary: Media server for movies, TV and music on port 8096, pointed at a media folder
    ports: ["8096:8096"]
    volumes: ["jellyfin-config:/config", "jellyfin-cache:/cache", "/srv/media:/media"]
    gpu: false
    images: {default: docker.io/jellyfin/jellyfin:12.1}
  - id: prometheus
    title: Prometheus
    summary: Metrics collection and storage on port 9090, scraping itself out of the box
    ports: ["9090:9090"]
    volumes: ["prometheus-data:/prometheus", "/etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    gpu: false
    images: {default: docker.io/prom/prometheus:v3.13.3}
  - id: grafana
    title: Grafana
    summary: Dashboards on port 3000, pre-wired to the Prometheus appliance service as its default data source
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana", "/etc/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro"]
    gpu: false
    images: {default: docker.io/grafana/grafana:13.2.2}
    needs: [prometheus]
  - id: postgres
    title: PostgreSQL
    summary: PostgreSQL database; the superuser password is read from a file this profile does not ship, so the service fails closed until one is created
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "/etc/postgres/superuser-password:/run/secrets/postgres-superuser-password:ro"]
    env: {POSTGRES_PASSWORD_FILE: "/run/secrets/postgres-superuser-password"}
    gpu: false
    images: {default: docker.io/library/postgres:17.11}
  - id: homeassistant
    title: Home Assistant
    summary: Home automation hub on port 8123; its own onboarding wizard creates the first (administrator) account
    ports: ["8123:8123"]
    volumes: ["homeassistant-config:/config"]
    gpu: false
    images: {default: docker.io/homeassistant/home-assistant:2026.9.3}
  - id: pihole
    title: Pi-hole
    summary: Network-wide ad and tracker blocking over DNS on port 53; the web UI's password is generated at random on first start
    ports: ["53:53/tcp", "53:53/udp", "80:80"]
    volumes: ["pihole-etc:/etc/pihole", "pihole-dnsmasq:/etc/dnsmasq.d"]
    env: {TZ: "UTC"}
    gpu: false
    images: {default: docker.io/pihole/pihole:2026.09.0}
  - id: nextcloud
    title: Nextcloud
    summary: Personal cloud for files, contacts and calendars on port 80, using SQLite so there is no separate database
    ports: ["80:80"]
    volumes: ["nextcloud-data:/var/www/html"]
    env: {SQLITE_DATABASE: "nextcloud"}
    gpu: false
    images: {default: docker.io/library/nextcloud:35.0.0-apache}
  - id: vaultwarden
    title: Vaultwarden
    summary: Bitwarden-compatible password manager on port 80; sign-ups disabled by default and must sit behind TLS before it is exposed
    ports: ["80:80"]
    volumes: ["vaultwarden-data:/data"]
    env: {SIGNUPS_ALLOWED: "false"}
    gpu: false
    images: {default: docker.io/vaultwarden/server:1.37.3}
  - id: portainer
    title: Portainer
    summary: Container management web UI on port 9443 for this machine's own containers; a random setup token gates the first admin account
    ports: ["9443:9443"]
    volumes: ["portainer-data:/data", "/run/podman/podman.sock:/var/run/docker.sock"]
    gpu: false
    images: {default: docker.io/portainer/portainer-ce:2.45.1}
  - id: uptime-kuma
    title: Uptime Kuma
    summary: Uptime and status-page monitoring on port 3001; its own setup screen creates the one admin account
    ports: ["3001:3001"]
    volumes: ["uptime-kuma-data:/app/data"]
    gpu: false
    images: {default: docker.io/louislam/uptime-kuma:2.5.5}
  - id: syncthing
    title: Syncthing
    summary: Peer-to-peer file synchronisation; sync (22000, TCP/UDP) and discovery (21027/UDP) are open, the unauthenticated web GUI (8384) is not
    ports: ["8384:8384", "22000:22000/tcp", "22000:22000/udp", "21027:21027/udp"]
    volumes: ["syncthing-config:/var/syncthing/config", "syncthing-data:/var/syncthing/data"]
    gpu: false
    images: {default: docker.io/syncthing/syncthing:2.1.5}
  - id: minio
    title: MinIO
    summary: S3-compatible object storage, API on port 9000 and console on port 9001; falls back to minioadmin:minioadmin if no root credentials are set
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    exec: "server /data --console-address :9001"
    gpu: false
    images: {default: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772}
  - id: n8n
    title: n8n
    summary: Workflow automation on port 5678 with a large library of ready integrations; its own setup screen creates the first (owner) account
    ports: ["5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n"]
    gpu: false
    images: {default: docker.io/n8nio/n8n:2.41.0}
  - id: wg-easy
    title: wg-easy
    summary: WireGuard VPN server with a peer-management web UI; the VPN itself (51820/udp) is open, its account-claiming web UI (51821) is not
    ports: ["51820:51820/udp", "51821:51821"]
    volumes: ["wg-easy-data:/etc/wireguard"]
    env: {WG_HOST: "192.0.2.1"}
    cap_add: [NET_ADMIN]
    gpu: false
    images: {default: ghcr.io/wg-easy/wg-easy:15.4.0}

# GPU compute stacks a profile may ship (hardware.gpu); what each adds is in the
# bases' package maps (gpu-nvidia, gpu-amd, gpu-intel).
gpus:
  - id: none
    name: No GPU stack
    summary: "Open drivers only. NVIDIA can still be added later by the installer's driver step."
  - id: nvidia
    name: NVIDIA
    summary: "Open kernel driver, CUDA toolkit and the container toolkit from NVIDIA's repository."
  - id: amd
    name: AMD Radeon
    summary: "In-kernel driver and ROCm tools; the ROCm runtime runs inside the containers."
  - id: intel
    name: Intel Arc
    summary: "OpenCL and Level Zero runtime on Ubuntu; Debian ships the loader only."
