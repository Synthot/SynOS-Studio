# Text and catalog data the configurator shows. Everything structural
# (bases, profiles, bundles, regions, package maps, stack roles, schemas)
# is read from the repository by tools/export_catalog.py; this file
# only carries descriptions and the searchable package catalog.
bundles:
  desktop-core: Desktop shell, firmware, translations, hardening baseline (always on)
  office: Office suite, PDF, calendar
  communication: Mail and browser
  remote-access: RDP and VDI clients
  printing: CUPS and driverless printing
  vpn: WireGuard and OpenVPN
  smartcard: OpenSC, PC/SC, eID readers
  directory: Domain join stack
  compliance: OpenSCAP and content
  containers: Podman and Buildah
  build-tools: Compilers, CMake, debugger
  media: Video and image tools
  web-admin: Cockpit web administration (services, storage, containers, terminal)
  virtualization: KVM virtual machines with libvirt
  ai-dev: PyTorch, Python tooling and llama.cpp for local model work
  yocto-build: Host tools required to build embedded images with the Yocto Project / OpenEmbedded (BitBake and friends), plus practical extras (rsync, ccache, QEMU for runqemu, and the like)
  yocto-build-docs: Packages to build the Yocto Project's own documentation, including PDFs (large — LaTeX and a full font set)

compliance:
  - {id: none, name: None}
  - {id: cis-level1, name: CIS Level 1}
  - {id: cis-level2, name: CIS Level 2}
  - {id: anssi-bp028-intermediate, name: ANSSI BP-028 intermediate (FR)}
  - {id: anssi-bp028-enhanced, name: ANSSI BP-028 enhanced (FR)}
  - {id: bsi-sys-1-3, name: BSI SYS.1.3 (DE)}
  - {id: bio, name: BIO (NL)}
  - {id: ncsc-eud, name: NCSC EUD (UK)}
  - {id: itsg-33, name: ITSG-33 (CA)}
  - {id: nist-800-171, name: NIST 800-171 (US)}

