id: yocto-builder
extends: developer
description: >-
  Build host for Yocto Project / OpenEmbedded embedded images: the
  developer profile plus BitBake's required host packages (compiler,
  Python, git, texinfo and friends) and practical build-host extras (rsync,
  ccache, git-lfs, bmap-tools, a lean QEMU for runqemu). Needs an
  en_US.UTF-8 locale, generated by any region the manifest includes, and a
  lot of free disk space — the Yocto Project's own guidance is at least
  140 GB for a single target, more for several machines or a shared build
  cache. The bundle-catalog "Yocto build machine, full" entry extends this
  with the Yocto documentation and PDF toolchain (yocto-build-docs).
software:
  bundles: [yocto-build]
