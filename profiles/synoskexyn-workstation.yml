# SynOS Kexyn profile â€” extends workstation
id: synoskexyn-workstation
extends: workstation
description: SynOS Kexyn build of the workstation profile.
software:
  packages:
    add: [abiword, inkcut]
installer:
  filesystem: btrfs
  encryption: default-on
  automatic_login: false
  passwordless_sudo: false
  ssh: disabled
security:
  compliance: none
  usbguard: false
  firewall: default-deny-inbound
