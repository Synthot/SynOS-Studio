# My Workstation profile — extends workstation
id: myws-workstation
extends: workstation
description: My Workstation build of the workstation profile.
installer:
  filesystem: btrfs
  encryption: default-on
  automatic_login: false
  passwordless_sudo: false
  ssh: disabled
security:
  compliance: none
  usbguard: false
  firewall: default-deny-inbound
