# GitHub Actions template for SynOS image builds.
name: SynOS image
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest to build
        default: manifest.yml

env:
  MANIFEST: ${{ github.event.inputs.manifest || 'manifest.yml' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml python3-jsonschema python3-pil python3-jinja2 python3-gi gir1.2-atspi-2.0 gnupg dpkg-dev apt-utils fakeroot imagemagick librsvg2-bin xorriso mtools ffmpeg grub-common fonts-dejavu-core
      - run: python3 tools/render_manifest.py --manifest "$MANIFEST" --check
      - run: python3 tools/render_manifest.py --manifest "$MANIFEST"
      - run: python3 tools/render_brand.py --manifest "$MANIFEST"
      - run: PYTHONPATH=tests python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with: { name: resolved-config, path: .build/ }

  build:
    # A privileged self-hosted runner is required for the chroot build.
    needs: validate
    runs-on: [self-hosted, synos-builder]
    steps:
      - uses: actions/checkout@v4
      - run: make container-build MANIFEST="$MANIFEST"
        env: { SYNOS_SIGNING_KEY: "${{ secrets.SYNOS_SIGNING_KEY }}" }
      - name: Sign
        if: env.SIGNING_KEY != ''
        env: { SIGNING_KEY: "${{ secrets.SIGNING_KEY }}" }
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          for iso in dist/*.iso; do gpg --batch --yes --detach-sign --armor -o "$iso.asc" "$iso"; done
      - uses: actions/upload-artifact@v4
        with: { name: image, path: dist/ }

  acceptance:
    needs: build
    runs-on: [self-hosted, synos-builder, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image, path: dist/ }
      - run: make test TEST_ARGS=--no-tui
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results/ }
