- name: dconf profile consults the brand database
  ansible.builtin.lineinfile:
    path: /etc/dconf/profile/user
    line: "system-db:local"
    insertafter: "^user-db:user$"
    create: true
    mode: "0644"
  notify: dconf update

- name: Refuse a policy.dconf key that names neither a path nor a GSettings schema
  ansible.builtin.fail:
    msg: >-
      policy.dconf key {{ item }} has neither '/' nor '.' — it must name a
      GSettings schema and key, e.g.
      "org/gnome/desktop/lockdown/disable-command-line" (dconf path form) or
      "org.gnome.desktop.lockdown.disable-command-line" (dotted GSettings
      form). Both forms are accepted; this key is neither.
  loop: "{{ desktop_policy_dconf.keys() | list }}"
  when: "'/' not in item and '.' not in item"

# The template and copy modules below never create their destination's parent
# directory, and nothing installed into the image creates local.d/ or
# local.d/locks/ either. Each task used to assume the other's directory: a
# profile whose only dconf key carries the "locked" sentinel (kiosk.yml's
# disable-command-line, so every bundle extending kiosk) skips 50-policy, then
# the locks task fails with "Destination directory
# /etc/dconf/db/local.d/locks does not exist". Created only when the profile
# asks for a policy, so an image with none is left exactly as it was.
- name: dconf system database directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/dconf/db/local.d
    - /etc/dconf/db/local.d/locks
  when: desktop_policy_dconf | length > 0 or desktop_policy_locks | length > 0

- name: /etc/dconf/db/local.d/50-policy from the profile's policy.dconf
  ansible.builtin.template:
    src: dconf-local.j2
    dest: /etc/dconf/db/local.d/50-policy
    mode: "0644"
  when: desktop_policy_dconf | length > 0
  notify: dconf update

- name: dconf locks
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/50-policy
    mode: "0644"
    content: "{{ desktop_policy_locks | join('\n') }}\n"
  when: desktop_policy_locks | length > 0
  notify: dconf update

- name: Firefox enterprise policy
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
    content: "{{ {'policies': {'Homepage': {'URL': desktop_policy_browser_homepage, 'StartPage': 'homepage'}, 'DisableTelemetry': true}} | to_nice_json }}"
  when: desktop_policy_browser_homepage | length > 0
