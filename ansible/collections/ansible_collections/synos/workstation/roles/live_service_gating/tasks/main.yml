# Nothing the appliance itself explicitly declared (see
# tools/render_manifest.py's "appliance" package list — software.packages
# .add resolved across the whole extends chain, plus every literal
# software.repositories[].packages entry, e.g. kubernetes-server's own
# kubelet/kubeadm/kubectl/cri-tools from pkgs.k8s.io — and
# docs/ARCHITECTURE.md, "Live session vs. installed system") may start in
# the live session: every live boot carries rd.synos.live=1 on the kernel
# command line, and that session is deliberately passwordless. This is
# deliberately narrower than "everything the profile installs beyond the
# desktop group": a curated group in profiles/bundles.yml (printing ->
# cups, containers -> podman) is a workstation convenience, not an
# appliance service, and must keep working in the live session too — only
# a package the appliance profile named itself, one of the two ways above,
# is in scope. dpkg already enabled these units by policy when the
# packages were installed (mods/06-profile-software for packages.add, mod
# 08 for a repository's own packages), so an installed system needs
# nothing done to it here — only the live boot's own attempt to start them
# is refused, by the same ConditionKernelCommandLine=!rd.synos.live the
# container_services quadlet template carries for software.services.
- name: Units shipped by the appliance's own explicit package declarations (service and socket, never a curated group)
  ansible.builtin.shell: |
    set -e
    for pkg in {{ live_service_gating_packages | map('quote') | join(' ') }}; do
      dpkg -s "$pkg" >/dev/null 2>&1 || continue
      dpkg -L "$pkg" 2>/dev/null
    done | grep -E '^/(usr/)?lib/systemd/system/[^/]+\.(service|socket)$' | xargs -r -n1 basename | sort -u
  args:
    executable: /bin/sh
  register: synos_live_gated_units
  changed_when: false
  when: live_service_gating_packages | length > 0

- name: Drop-in directory for each gated unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: "{{ synos_live_gated_units.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: live_service_gating_packages | length > 0

- name: Never start this appliance unit in the live session (installed systems are unaffected)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.d/90-synos-live-suppress.conf"
    mode: "0644"
    content: |
      # Generated by synos.workstation.live_service_gating: this unit came
      # from a package the appliance profile itself named (software
      # .packages.add or its own software.repositories[].packages), never a
      # curated bundles.yml group. An installed system starts it normally;
      # the live session (rd.synos.live=1 on every live boot) never does,
      # because it is deliberately passwordless. See docs/ARCHITECTURE.md,
      # "Live session vs. installed system".
      [Unit]
      ConditionKernelCommandLine=!rd.synos.live
  loop: "{{ synos_live_gated_units.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: live_service_gating_packages | length > 0
