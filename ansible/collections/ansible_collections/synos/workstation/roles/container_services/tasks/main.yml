# Containers as system services (podman quadlet). Images are pulled on first
# start, so the image build stays small and reproducible (netavark carries the
# container DNS since 1.15; there is no aardvark-dns package any more); GPU access follows
# the profile's hardware.gpu choice.
- name: Ensure the apt cache is ready for the container services packages
  ansible.builtin.include_role:
    name: synos.workstation.apt_cache_ready
  when: container_services | length > 0

- name: podman and netavark for the container services
  when: container_services | length > 0
  block:
    - name: podman for the container services
      ansible.builtin.apt:
        name: [podman, netavark]
        state: present
        install_recommends: false
  rescue:
    - name: Read the apt components configured for this build
      ansible.builtin.command: grep -h '^Components:' /etc/apt/sources.list.d/*.sources
      register: synos_container_services_apt_components
      changed_when: false
      failed_when: false

    - name: Fail naming the package and the component it needs
      ansible.builtin.fail:
        msg: >-
          Could not install the container services packages (podman,
          netavark) from the archive: {{ ansible_failed_result.msg | default('apt failed') }}.
          Both live in this base's universe component (see
          bases/ubuntu/sources.tmpl, COMPONENTS). Components configured for
          this build: {{ (synos_container_services_apt_components.stdout_lines
            | default([]) | map('regex_replace', '^Components:\\s*', '') | list | join(' | '))
            or 'none found (no *.sources file under /etc/apt/sources.list.d)' }}.
          If universe is missing from that list, enable it; if it is
          present, the apt cache is stale — apt_cache_ready should have
          refreshed it, so check that this role still includes it before
          this task.

- name: Quadlet directory
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"
  when: container_services | length > 0

- name: Quadlet units from the profile
  ansible.builtin.template:
    src: service.container.j2
    dest: "/etc/containers/systemd/{{ item.name }}.container"
    mode: "0644"
  loop: "{{ container_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: NVIDIA container runtime hook (the toolkit comes from the profile's repository)
  ansible.builtin.copy:
    dest: /etc/systemd/system/synos-nvidia-cdi.service
    mode: "0644"
    content: |
      [Unit]
      Description=SynOS: generate the NVIDIA CDI specification for containers
      ConditionPathExists=/usr/bin/nvidia-ctk
      After=systemd-modules-load.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: container_services_gpu == 'nvidia'

- name: Enable the NVIDIA CDI unit (symlink works in the chroot)
  ansible.builtin.file:
    src: /etc/systemd/system/synos-nvidia-cdi.service
    dest: /etc/systemd/system/multi-user.target.wants/synos-nvidia-cdi.service
    state: link
  when: container_services_gpu == 'nvidia'

- name: GPU device access for the first user (render and video groups, applied by the installer's user step)
  ansible.builtin.copy:
    dest: /etc/synos/gpu
    mode: "0644"
    content: "{{ container_services_gpu }}\n"
  when: container_services_gpu != 'none'
