- name: Copy the brand kit package
  ansible.builtin.copy:
    src: "{{ desktop_branding_package }}"
    dest: "/tmp/{{ desktop_branding_package | basename }}"
    mode: "0644"
  when: desktop_branding_package | length > 0 and not desktop_branding_package.startswith('http')

- name: Download the brand kit package
  ansible.builtin.get_url:
    url: "{{ desktop_branding_package }}"
    dest: "/tmp/{{ desktop_branding_package | basename }}"
    mode: "0644"
  when: desktop_branding_package.startswith('http')

- name: Ensure the apt cache is ready (the brand kit .deb can pull dependencies from the archive)
  ansible.builtin.include_role:
    name: synos.workstation.apt_cache_ready
  when: desktop_branding_package | length > 0

- name: Install the brand kit
  ansible.builtin.apt:
    deb: "/tmp/{{ desktop_branding_package | basename }}"
  when: desktop_branding_package | length > 0

- name: Verify the machine identity
  ansible.builtin.shell: '. /etc/os-release && test "$ID" = "{{ desktop_branding_brand_id }}"'
  changed_when: false
