# Customer playbook run inside the build chroot after the profile policy.
# Anything a company adds on top of the image belongs here: certificates,
# VPN profiles, proxy settings, printers, agents.
- name: Acme finance workstation customisation
  hosts: all
  gather_facts: false
  tasks:
    - name: Corporate CA certificate
      ansible.builtin.copy:
        dest: /usr/local/share/ca-certificates/acme-root-ca.crt
        mode: "0644"
        content: |
          -----BEGIN CERTIFICATE-----
          (paste the Acme root CA here; the file is a placeholder)
          -----END CERTIFICATE-----
      notify: update ca certificates

    - name: Proxy for apt
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/80proxy
        mode: "0644"
        content: 'Acquire::http::Proxy "http://proxy.corp.acme.example:3128";'

    - name: Default printer discovery on the finance floor
      ansible.builtin.copy:
        dest: /etc/cups/client.conf
        mode: "0644"
        content: "ServerName print.corp.acme.example\n"
  handlers:
    - name: update ca certificates
      ansible.builtin.command: update-ca-certificates
      changed_when: true
