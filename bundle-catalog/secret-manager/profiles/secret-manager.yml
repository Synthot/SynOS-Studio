id: secret-manager
extends: server
description: >-
  Server profile running OpenBao as a system service: the open-source
  fork of HashiCorp Vault, kept after Vault's licence changed to the
  Business Source Licence, which does not fit a GPL engine's catalogue.
  Storage is OpenBao's own integrated Raft, not the deprecated file
  backend. It ships sealed and completely uninitialised: no unseal key
  and no root token exist anywhere in this repository or the image, so
  port 8200 stays closed until an operator initialises and unseals it.
software:
  services:
    - name: openbao
      image: docker.io/openbao/openbao:2.6.2
      ports: ["8200:8200"]
      volumes:
        - openbao-data:/openbao/file
      env:
        BAO_LOCAL_CONFIG: '{"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"storage":{"raft":{"path":"/openbao/file","node_id":"node1"}},"cluster_addr":"http://127.0.0.1:8201","api_addr":"http://127.0.0.1:8200","disable_mlock":true}'
      exec: "server"
security:
  open_ports: [22/tcp]
