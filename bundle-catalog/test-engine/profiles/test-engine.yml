id: test-engine
extends: yocto-builder
description: >-
  The Yocto build host (profiles/yocto-builder.yml) plus everything this
  engine's own catalog-conformance test service needs
  (packaging/install-test-engine.sh; profiles/bundles.yml, "test-engine"):
  a container runtime, QEMU, xorriso, Tesseract OCR, Pillow, PyYAML and a
  headless Chromium, to build a catalogued bundle, boot the resulting
  image under QEMU and read its boot screen with OCR. Stays on this
  engine's usual Ubuntu noble: Ubuntu's own "chromium"/"chromium-browser"
  only installs the Chromium snap, which this engine's images never
  carry, so the browser comes from packages/google-chrome-synos instead
  — a fork of Google's own real, non-snap google-chrome-stable .deb
  (dl.google.com), the same way packages/firefox-synos already forks
  Firefox from Mozilla's own repository. Still needs an en_US.UTF-8
  locale and the Yocto build host's disk space (at least 140 GB), more
  here for the container images and ISOs a conformance run keeps around.
software:
  bundles: [test-engine]
