id: password-manager
extends: server
description: >-
  Server profile running Vaultwarden (an unofficial Bitwarden-compatible
  server) as a system service on port 80. Sign-ups are disabled by
  default (SIGNUPS_ALLOWED=false) so nobody can create a vault until the
  person turns that on; no admin token is set either, so Vaultwarden's
  own /admin panel is disabled outright rather than protected by a
  shipped secret. Port 80 stays closed by default and is not meant to be
  opened as plain HTTP at all: every Bitwarden client refuses a server
  that is not HTTPS, so this must sit behind a TLS-terminating reverse
  proxy (this catalog's Nginx, Apache or Caddy appliance) before it is
  reachable from anything but this machine or a tunnel.
software:
  services:
    - name: vaultwarden
      image: docker.io/vaultwarden/server:1.37.3
      ports: ["80:80"]
      volumes:
        - vaultwarden-data:/data
      env:
        SIGNUPS_ALLOWED: "false"
security:
  open_ports: [22/tcp]
