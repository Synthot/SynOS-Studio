id: web-server-apache
extends: server
description: >-
  Server profile running Apache httpd as a system service: a placeholder
  site on port 80, ready as a reverse proxy, and a place for a TLS
  certificate on port 443. The traditional, most broadly documented and
  module-rich of the three web server appliances.
software:
  services:
    - name: apache
      image: docker.io/library/httpd:2.4.68
      ports: ["80:80", "443:443"]
      volumes:
        - /srv/www:/usr/local/apache2/htdocs:ro
        - /etc/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
        - /etc/apache/certs:/etc/apache/certs:ro
  files:
    - path: /srv/www/index.html
      content: |
        <!doctype html>
        <title>It works</title>
        <p>This SynOS web server appliance is running Apache httpd. Replace
        this page under /srv/www.</p>
    - path: /etc/apache/httpd.conf
      content: |
        ServerRoot "/usr/local/apache2"
        Listen 80

        LoadModule mpm_event_module modules/mod_mpm_event.so
        LoadModule authz_core_module modules/mod_authz_core.so
        LoadModule dir_module modules/mod_dir.so
        LoadModule mime_module modules/mod_mime.so
        LoadModule unixd_module modules/mod_unixd.so
        LoadModule log_config_module modules/mod_log_config.so

        User daemon
        Group daemon

        ServerAdmin you@example.com
        ServerName localhost:80

        DocumentRoot "/usr/local/apache2/htdocs"
        <Directory "/usr/local/apache2/htdocs">
            Options Indexes FollowSymLinks
            AllowOverride None
            Require all granted
        </Directory>

        DirectoryIndex index.html

        TypesConfig conf/mime.types

        ErrorLog /proc/self/fd/2
        LogFormat "%h %l %u %t \"%r\" %>s %b" common
        CustomLog /proc/self/fd/1 common

        # TLS: LoadModule ssl_module modules/mod_ssl.so, then Listen 443 and a
        # <VirtualHost *:443> block with SSLCertificateFile / SSLCertificateKeyFile
        # pointing into /etc/apache/certs (already bind-mounted read-only).
security:
  open_ports: [22/tcp, 80/tcp, 443/tcp]
