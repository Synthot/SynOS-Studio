id: database-server
extends: server
description: >-
  Server profile running PostgreSQL as a system service on port 5432; the
  superuser password is read from a placeholder file, never baked into
  the image.
software:
  services:
    - name: postgres
      image: docker.io/library/postgres:17.11
      ports: ["5432:5432"]
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - /etc/postgres/superuser-password:/run/secrets/postgres-superuser-password:ro
      env:
        POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
  files:
    - path: /etc/postgres/superuser-password
      content: "change-this-placeholder-before-first-connecting\n"
security:
  open_ports: [22/tcp, 5432/tcp]
