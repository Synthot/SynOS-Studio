id: database-server
extends: server
description: >-
  Server profile running PostgreSQL as a system service, its superuser
  password read from /etc/postgres/superuser-password — a file this
  profile does not ship. The service fails to start until that file
  exists, on purpose: no working credential is baked into the image.
  Port 5432 stays closed until the password is set (see the bundle
  catalog summary).
software:
  services:
    - name: postgres
      image: docker.io/library/postgres:17.11
      ports: ["5432:5432"]
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - /etc/postgres/superuser-password:/run/secrets/postgres-superuser-password:ro
      env:
        POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
security:
  open_ports: [22/tcp]
