  - id: devops-platform
    name: DevOps Platform (GitLab)
    summary: "Self-hosted GitLab Community Edition as a system service — never Enterprise Edition, which needs a paid licence. It is heavy: at least 8 GB memory (16 GB is GitLab's own baseline) and about 40 GB disk for the application alone, before repositories or a growing database."
    first_boot:
      - "Git over SSH (port 2222) is open from the start — cloning or pushing needs a registered account and key, and none exists yet."
      - "The web UI (80/443) stays closed by default: GitLab writes a random root password inside the container on first start, valid only 24 hours. Tunnel in first (`ssh -L 8080:localhost:80 you@host`), read it (`sudo podman exec gitlab cat /etc/gitlab/initial_root_password`), sign in as root at http://localhost:8080/, and set a real password."
      - "Public sign-up ships on (GitLab's own default): turn it off in the admin area (Settings > General > Sign-up restrictions) while you are in there, unless you want it."
      - "Then open the web ports yourself (`sudo ufw allow 80/tcp && sudo ufw allow 443/tcp`)."
    tags: [gitlab, devops-platform, version-control, ci-cd, code-review]
    folder: devops-platform
    services: [gitlab]
    ports: [22, 2222]
    verified: true
