# The bundle catalog: ready-made bundles a person can start from instead of
# starting from scratch (docs/BUNDLE.md, "The bundle catalog"). Each entry
# names one folder here; tools/export_catalog.py reads the folder's files and
# exports them verbatim as bundle_catalog[].files. Every entry here ships with
# the engine, so verified is true and contributed_by is omitted throughout;
# a community-proposed entry would set both (see docs/BUNDLE.md).
#
# summary: one sentence, no commands, no "first boot" clause — what the
# machine is and what it runs, the way a catalogue entry reads. first_boot:
# the steps a person does first, one short string per step (a command may
# appear inside a step); [] when there is no meaningful first step rather
# than invented filler.
bundle_catalog:
  - id: yocto-builder
    name: Yocto Build Machine
    summary: "The everyday Yocto/OpenEmbedded build host: BitBake's required host packages plus practical build tools (rsync, ccache, a lean QEMU for runqemu), needing an en_US.UTF-8 locale and at least 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, cross-compile, build-host]
    folder: yocto-builder
    services: []
    ports: []
    verified: true
  - id: yocto-builder-docs
    name: Yocto Build Machine, full
    summary: "The larger Yocto/OpenEmbedded build host that also builds the Yocto Project's own documentation, including PDFs: everything the lean build host has, plus LaTeX and a full font set, needing well over 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, documentation, latex, build-host]
    folder: yocto-builder-docs
    services: []
    ports: []
    verified: true
  - id: ai-workstation
    name: AI Workstation
    summary: "A developer workstation with PyTorch and llama.cpp for local model work; the GPU compute stack and inference services (Ollama, Open WebUI, vLLM) are chosen when this bundle is opened."
    first_boot: []
    tags: [ai, machine-learning, pytorch, llama.cpp, gpu, local-inference]
    folder: ai-workstation
    services: []
    ports: []
    verified: true
  - id: kodi-media-centre
    name: Kodi Media Centre
    summary: "A kiosk that boots straight into Kodi, with remote/CEC and joystick support already installed."
    first_boot:
      - "Point Kodi at your media library (Settings > Media > Library)."
      - "Kodi's own web interface is off by default; if you turn it on, set a password for it there before opening its port yourself."
    tags: [kodi, media-center, home-theater, kiosk, hdmi-cec, remote-control]
    folder: kodi-media-centre
    services: []
    ports: []
    verified: true
  - id: web-server-nginx
    name: Web Server (Nginx)
    summary: "Nginx serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the leanest and fastest of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/nginx/certs to enable the commented-out TLS block in /etc/nginx/conf.d/site.conf."
    tags: [nginx, web-server, reverse-proxy, http, tls]
    folder: web-server-nginx
    services: [nginx]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-apache
    name: Web Server (Apache)
    summary: "Apache httpd serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the traditional, most broadly documented and module-rich of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/apache/certs to enable the commented-out TLS block in /etc/apache/httpd.conf."
    tags: [apache, httpd, web-server, reverse-proxy, http, tls]
    folder: web-server-apache
    services: [apache]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-caddy
    name: Web Server (Caddy)
    summary: "Caddy serving a placeholder page on ports 80 and 443 — distinguished from the other two web server appliances by automatic HTTPS."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Replace \":80\" in /etc/caddy/Caddyfile with your real domain name — Caddy obtains and renews its certificate for you."
    tags: [caddy, web-server, https, acme, automatic-tls]
    folder: web-server-caddy
    services: [caddy]
    ports: [22, 80, 443]
    verified: true
  - id: container-registry
    name: Container Registry
    summary: "An OCI/Docker image registry on port 5000 with HTTP basic authentication already configured and storage on its own volume."
    first_boot:
      - "The shipped htpasswd file is a placeholder that matches no real password, so every login is refused until you replace it: `htpasswd -Bc /etc/registry/htpasswd <user>`, then restart the registry service, before pushing images."
    tags: [registry, oci, docker, container-images, ci-cd]
    folder: container-registry
    services: [registry]
    ports: [22, 5000]
    verified: true
  - id: git-server
    name: Git Server
    summary: "Self-hosted Git (Gitea) with a web UI, issues and pull requests, and git over SSH on port 2222."
    first_boot:
      - "Git over SSH (port 2222) is open from the start — it accepts nothing until an account with a registered key exists."
      - "The web UI's port 3000 stays closed by default, since whoever reaches it first would register the first account and Gitea makes it an administrator: tunnel in first (`ssh -L 3000:localhost:3000 you@host`), register that account at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [git, gitea, version-control, code-review, ci-cd]
    folder: git-server
    services: [gitea]
    ports: [22, 2222]
    verified: true
  - id: media-server
    name: Media Server
    summary: "A Jellyfin media server pointed at /srv/media for your video and music library."
    first_boot:
      - "Port 8096 stays closed by default, since Jellyfin's own setup wizard (which creates the admin account) is open to whoever reaches it first: tunnel in first (`ssh -L 8096:localhost:8096 you@host`), finish the wizard at http://localhost:8096/, then open 8096 yourself (`sudo ufw allow 8096/tcp`)."
    tags: [jellyfin, media-server, streaming, movies, music]
    folder: media-server
    services: [jellyfin]
    ports: [22]
    verified: true
  - id: monitoring-server
    name: Monitoring Server
    summary: "Prometheus and Grafana as system services, Grafana already pointed at Prometheus as its default data source."
    first_boot:
      - "Prometheus (port 9090) is open by default — nothing to sign into."
      - "Grafana's port 3000 stays closed by default: it signs in as admin/admin until changed, so whoever reaches it first owns it. Tunnel in first (`ssh -L 3000:localhost:3000 you@host`), sign in and set a real password at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [monitoring, prometheus, grafana, metrics, dashboards, observability]
    folder: monitoring-server
    services: [prometheus, grafana]
    ports: [22, 9090]
    verified: true
  - id: database-server
    name: Database Server
    summary: "PostgreSQL as a system service, its superuser password read from a file this profile deliberately does not ship."
    first_boot:
      - "It fails to start until you create that password file: `printf '%s' 'a-real-password' | sudo tee /etc/postgres/superuser-password >/dev/null && sudo chmod 600 /etc/postgres/superuser-password && sudo systemctl restart postgres`."
      - "Open port 5432 yourself (`sudo ufw allow 5432/tcp`) once that password is set to something private of your own."
    tags: [postgresql, database, sql, postgres]
    folder: database-server
    services: [postgres]
    ports: [22]
    verified: true
  - id: kubernetes-server
    name: Kubernetes Server
    summary: "A single-node Kubernetes control plane (kubeadm, kubelet, kubectl, containerd) from the community pkgs.k8s.io repository pinned to v1.31, with the kernel modules and sysctl settings a node needs already in place."
    first_boot:
      - "Only the API server (6443) and the kubelet API (10250) are opened by default; etcd (2379-2380/tcp) and the NodePort range (30000-32767/tcp) stay closed until you add nodes or expose a service that way."
      - "Fix containerd's cgroup driver and initialise the cluster: `containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | sudo tee /etc/containerd/config.toml >/dev/null && sudo systemctl restart containerd && sudo kubeadm init --pod-network-cidr=10.244.0.0/16`."
      - "Install a CNI plugin."
    tags: [kubernetes, k8s, kubeadm, container-orchestration, cluster]
    folder: kubernetes-server
    services: []
    ports: [22, 6443, 10250]
    verified: true
  - id: audio-workstation
    name: Audio Production Workstation
    summary: "A digital audio workstation: Ardour on PipeWire's JACK-compatible layer (pipewire-jack, qpwgraph, a2jmidid), realtime scheduling already granted to the audio group, and a set of instrument and effect plugins (Calf, x42, LSP, Hydrogen, Guitarix, Rakarrack)."
    first_boot:
      - "If your account is not already in the audio group (most desktop installs add it automatically), add it yourself: `sudo usermod -aG audio $USER`, then log out and back in — the realtime limits only apply to that group."
      - "Open qpwgraph to see and rewire PipeWire's audio graph; Ardour connects to it automatically, no separate server to start."
    tags: [audio, daw, pipewire, jack, music-production, realtime, ardour]
    folder: audio-workstation
    services: []
    ports: []
    verified: true
  - id: video-editing-workstation
    name: Video Editing Workstation
    summary: "A video editing workstation: Kdenlive with ffmpeg's codecs, and VA-API/VDPAU hardware acceleration for faster encode and decode on Intel and AMD GPUs."
    first_boot:
      - "Run `vainfo` to confirm your GPU's VA-API driver loaded before relying on hardware acceleration in Kdenlive's render settings."
    tags: [video, editing, kdenlive, ffmpeg, hardware-acceleration, vaapi]
    folder: video-editing-workstation
    services: []
    ports: []
    verified: true
  - id: photography-workstation
    name: Photography Workstation
    summary: "A photography workstation: darktable and RawTherapee for RAW processing, ArgyllCMS and DisplayCAL for colour management and display calibration, and gphoto2 for tethered shooting."
    first_boot:
      - "Calibrate your monitor with DisplayCAL (a graphical front end for ArgyllCMS, from a colorimeter) and load the resulting ICC profile in Settings > Color before trusting on-screen colour."
    tags: [photography, raw-processing, darktable, rawtherapee, color-management]
    folder: photography-workstation
    services: []
    ports: []
    verified: true
  - id: cad-3d-printing-workstation
    name: CAD and 3D Printing Workstation
    summary: "A CAD and 3D printing workstation on Debian trixie: FreeCAD and OpenSCAD for modelling and Cura for slicing, with a udev rule already granting the dialout group access to common printer and microcontroller boards."
    first_boot:
      - "If your account is not already in the dialout group (most desktop installs add it automatically), add it yourself: `sudo usermod -aG dialout $USER`, then log out and back in before your printer or board appears without sudo."
    tags: [cad, 3d-printing, freecad, openscad, cura, udev, dialout]
    folder: cad-3d-printing-workstation
    services: []
    ports: []
    verified: true
  - id: data-science-workstation
    name: Data Science Workstation
    summary: "A data science workstation: the developer profile plus the Python scientific stack (NumPy, SciPy, pandas, scikit-learn, Matplotlib, seaborn) and a Jupyter Notebook launcher already on the applications menu."
    first_boot:
      - "Open \"Jupyter Notebook\" from the applications menu, or run `jupyter-notebook` yourself; it starts in your home directory."
    tags: [data-science, python, jupyter, numpy, pandas, scikit-learn]
    folder: data-science-workstation
    services: []
    ports: []
    verified: true
  - id: security-research-workstation
    name: Security Research Workstation
    summary: "A security research workstation for lawful, authorised network and web analysis: nmap, Wireshark, tcpdump, aircrack-ng, sqlmap, Nikto, Hydra, John the Ripper, Hashcat, Gobuster, WhatWeb and dirb, with a pcap group already granted non-root packet capture."
    first_boot:
      - "Add your account to the pcap group so packet capture needs no sudo — `sudo usermod -aG pcap $USER` — then log out and back in before opening Wireshark or running tcpdump."
    tags: [security-research, penetration-testing, network-analysis, wireshark, nmap, packet-capture]
    folder: security-research-workstation
    services: []
    ports: []
    verified: true
  - id: digital-signage
    name: Digital Signage
    summary: "A kiosk that boots straight into a full-screen browser showing one URL, set in a single configuration file."
    first_boot:
      - "Edit /etc/firefox/policies/policies.json and change the Homepage URL to your sign's page, then restart the browser (or reboot)."
    tags: [digital-signage, kiosk, browser, display]
    folder: digital-signage
    services: []
    ports: []
    verified: true
  - id: retro-gaming-console
    name: Retro Gaming Console
    summary: "A console-style kiosk that boots straight into RetroArch, with joystick and gamepad autodetection and six libretro cores already installed (SNES, Game Boy Advance, Game Boy, Nintendo DS, NES, PC Engine)."
    first_boot:
      - "No ROMs are shipped (that content is yours to provide lawfully): add them under a content directory of your choice and point RetroArch's playlists at it from its own menu."
    tags: [retro-gaming, retroarch, emulation, kiosk, controller-support]
    folder: retro-gaming-console
    services: []
    ports: []
    verified: true
  - id: classroom-workstation
    name: Classroom / Shared-Desk Workstation
    summary: "A locked-down workstation for a school or library: no command line, no user administration, a short auto screen-lock, and USBGuard blocking any USB device beyond keyboards, mice and hubs until an administrator allows it."
    first_boot:
      - "USBGuard already blocks anything beyond keyboards, mice and hubs: plug in and allow a device this room genuinely needs as an administrator (`sudo usbguard allow-device <id>`) before handing the machine to the next person."
    tags: [classroom, shared-desk, lockdown, usbguard, education, library]
    folder: classroom-workstation
    services: []
    ports: []
    verified: true
