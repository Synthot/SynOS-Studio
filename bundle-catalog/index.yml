  - id: event-streaming
    name: Event Streaming (Kafka)
    summary: "A single-broker Apache Kafka cluster running in KRaft mode as a system service — no separate ZooKeeper ensemble to run or lose quorum in."
    first_boot:
      - "Port 9092 stays closed by default: a fresh broker accepts any client with no authentication configured, so whoever reaches it first can create, read or delete any topic."
      - "Reach it over an SSH tunnel first (`ssh -L 9092:localhost:9092 you@host`) to try it, then put real authentication (SASL or mTLS) in front of it before opening the port yourself (`sudo ufw allow 9092/tcp`)."
