# The bundle catalog: ready-made bundles a person can start from instead of
# starting from scratch (docs/BUNDLE.md, "The bundle catalog"). Each entry
# names one folder here; tools/export_catalog.py reads the folder's files and
# exports them verbatim as bundle_catalog[].files. Every entry here ships with
# the engine, so verified is true and contributed_by is omitted throughout;
# a community-proposed entry would set both (see docs/BUNDLE.md).
#
# summary: one sentence, no commands, no "first boot" clause — what the
# machine is and what it runs, the way a catalogue entry reads. first_boot:
# the steps a person does first, one short string per step (a command may
# appear inside a step); [] when there is no meaningful first step rather
# than invented filler.
bundle_catalog:
  - id: yocto-builder
    name: Yocto Build Machine
    summary: "The everyday Yocto/OpenEmbedded build host: BitBake's required host packages plus practical build tools (rsync, ccache, a lean QEMU for runqemu), needing an en_US.UTF-8 locale and at least 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, cross-compile, build-host]
    folder: yocto-builder
    services: []
    ports: []
    verified: true
  - id: yocto-builder-docs
    name: Yocto Build Machine, full
    summary: "The larger Yocto/OpenEmbedded build host that also builds the Yocto Project's own documentation, including PDFs: everything the lean build host has, plus LaTeX and a full font set, needing well over 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, documentation, latex, build-host]
    folder: yocto-builder-docs
    services: []
    ports: []
    verified: true
  - id: test-engine
    name: Test Engine Build Machine
    summary: "The Yocto build host plus everything this engine's own catalog-conformance test service needs to build a catalogued bundle, boot it under QEMU and read its boot screen with OCR: a container runtime, QEMU, xorriso, Tesseract, Pillow, PyYAML and a headless Chromium."
    first_boot:
      - "Run 'sudo packaging/install-test-engine.sh --site-url=<your Studio URL>' from a checkout of this engine on this machine: it verifies every dependency, points podman's storage at a disk with room for a build, writes /etc/synos/conformance.yml and installs the systemd units."
      - "Its timers are installed but not enabled: 'sudo systemctl enable --now synos-conformance-check.timer synos-conformance-build.timer' once that first run looks right."
    tags: [yocto, testing, conformance, qemu, ocr, build-host]
    folder: test-engine
    services: []
    ports: []
    verified: true
  - id: ai-workstation
    name: AI Workstation
    summary: "A developer workstation with PyTorch and llama.cpp for local model work; the GPU compute stack and inference services (Ollama, Open WebUI, vLLM) are chosen when this bundle is opened."
    first_boot: []
    tags: [ai, machine-learning, pytorch, llama.cpp, gpu, local-inference]
    folder: ai-workstation
    services: []
    ports: []
    verified: true
  - id: kodi-media-centre
    name: Kodi Media Centre
    summary: "A kiosk that boots straight into Kodi, with remote/CEC and joystick support already installed."
    first_boot:
      - "Point Kodi at your media library (Settings > Media > Library)."
      - "Kodi's own web interface is off by default; if you turn it on, set a password for it there before opening its port yourself."
    tags: [kodi, media-center, home-theater, kiosk, hdmi-cec, remote-control]
    folder: kodi-media-centre
    services: []
    ports: []
    verified: true
  - id: web-server-nginx
    name: Web Server (Nginx)
    summary: "Nginx serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the leanest and fastest of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/nginx/certs to enable the commented-out TLS block in /etc/nginx/conf.d/site.conf."
    tags: [nginx, web-server, reverse-proxy, http, tls]
    folder: web-server-nginx
    services: [nginx]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-apache
    name: Web Server (Apache)
    summary: "Apache httpd serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the traditional, most broadly documented and module-rich of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/apache/certs to enable the commented-out TLS block in /etc/apache/httpd.conf."
    tags: [apache, httpd, web-server, reverse-proxy, http, tls]
    folder: web-server-apache
    services: [apache]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-caddy
    name: Web Server (Caddy)
    summary: "Caddy serving a placeholder page on ports 80 and 443 — distinguished from the other two web server appliances by automatic HTTPS."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Replace \":80\" in /etc/caddy/Caddyfile with your real domain name — Caddy obtains and renews its certificate for you."
    tags: [caddy, web-server, https, acme, automatic-tls]
    folder: web-server-caddy
    services: [caddy]
    ports: [22, 80, 443]
    verified: true
  - id: container-registry
    name: Container Registry
    summary: "An OCI/Docker image registry on port 5000 with HTTP basic authentication already configured and storage on its own volume."
    first_boot:
      - "The shipped htpasswd file is a placeholder that matches no real password, so every login is refused until you replace it: `htpasswd -Bc /etc/registry/htpasswd <user>`, then restart the registry service, before pushing images."
    tags: [registry, oci, docker, container-images, ci-cd]
    folder: container-registry
    services: [registry]
    ports: [22, 5000]
    verified: true
  - id: git-server
    name: Git Server
    summary: "Self-hosted Git (Gitea) with a web UI, issues and pull requests, and git over SSH on port 2222."
    first_boot:
      - "Git over SSH (port 2222) is open from the start — it accepts nothing until an account with a registered key exists."
      - "The web UI's port 3000 stays closed by default, since whoever reaches it first would register the first account and Gitea makes it an administrator: tunnel in first (`ssh -L 3000:localhost:3000 you@host`), register that account at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [git, gitea, version-control, code-review, ci-cd]
    folder: git-server
    services: [gitea]
    ports: [22, 2222]
    verified: true
  - id: media-server
    name: Media Server
    summary: "A Jellyfin media server pointed at /srv/media for your video and music library."
    first_boot:
      - "Port 8096 stays closed by default, since Jellyfin's own setup wizard (which creates the admin account) is open to whoever reaches it first: tunnel in first (`ssh -L 8096:localhost:8096 you@host`), finish the wizard at http://localhost:8096/, then open 8096 yourself (`sudo ufw allow 8096/tcp`)."
    tags: [jellyfin, media-server, streaming, movies, music]
    folder: media-server
    services: [jellyfin]
    ports: [22]
    verified: true
  - id: monitoring-server
    name: Monitoring Server
    summary: "Prometheus and Grafana as system services, Grafana already pointed at Prometheus as its default data source."
    first_boot:
      - "Prometheus (port 9090) is open by default — nothing to sign into."
      - "Grafana's port 3000 stays closed by default: it signs in as admin/admin until changed, so whoever reaches it first owns it. Tunnel in first (`ssh -L 3000:localhost:3000 you@host`), sign in and set a real password at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [monitoring, prometheus, grafana, metrics, dashboards, observability]
    folder: monitoring-server
    services: [prometheus, grafana]
    ports: [22, 9090]
    verified: true
  - id: database-server
    name: Database Server
    summary: "PostgreSQL as a system service, its superuser password read from a file this profile deliberately does not ship."
    first_boot:
      - "It fails to start until you create that password file: `printf '%s' 'a-real-password' | sudo tee /etc/postgres/superuser-password >/dev/null && sudo chmod 600 /etc/postgres/superuser-password && sudo systemctl restart postgres`."
      - "Open port 5432 yourself (`sudo ufw allow 5432/tcp`) once that password is set to something private of your own."
    tags: [postgresql, database, sql, postgres]
    folder: database-server
    services: [postgres]
    ports: [22]
    verified: true
  - id: kubernetes-server
    name: Kubernetes Server
    summary: "A single-node Kubernetes control plane (kubeadm, kubelet, kubectl, containerd) from the community pkgs.k8s.io repository pinned to v1.31, with the kernel modules and sysctl settings a node needs already in place."
    first_boot:
      - "Only the API server (6443) and the kubelet API (10250) are opened by default; etcd (2379-2380/tcp) and the NodePort range (30000-32767/tcp) stay closed until you add nodes or expose a service that way."
      - "Fix containerd's cgroup driver and initialise the cluster: `containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | sudo tee /etc/containerd/config.toml >/dev/null && sudo systemctl restart containerd && sudo kubeadm init --pod-network-cidr=10.244.0.0/16`."
      - "Install a CNI plugin."
    tags: [kubernetes, k8s, kubeadm, container-orchestration, cluster]
    folder: kubernetes-server
    services: []
    ports: [22, 6443, 10250]
    verified: true
  - id: audio-workstation
    name: Audio Production Workstation
    summary: "A digital audio workstation: Ardour on PipeWire's JACK-compatible layer (pipewire-jack, qpwgraph, a2jmidid), realtime scheduling already granted to the audio group, and a set of instrument and effect plugins (Calf, x42, LSP, Hydrogen, Guitarix, Rakarrack)."
    first_boot:
      - "If your account is not already in the audio group (most desktop installs add it automatically), add it yourself: `sudo usermod -aG audio $USER`, then log out and back in — the realtime limits only apply to that group."
      - "Open qpwgraph to see and rewire PipeWire's audio graph; Ardour connects to it automatically, no separate server to start."
    tags: [audio, daw, pipewire, jack, music-production, realtime, ardour]
    folder: audio-workstation
    services: []
    ports: []
    verified: true
  - id: video-editing-workstation
    name: Video Editing Workstation
    summary: "A video editing workstation: Kdenlive with ffmpeg's codecs, and VA-API/VDPAU hardware acceleration for faster encode and decode on Intel and AMD GPUs."
    first_boot:
      - "Run `vainfo` to confirm your GPU's VA-API driver loaded before relying on hardware acceleration in Kdenlive's render settings."
    tags: [video, editing, kdenlive, ffmpeg, hardware-acceleration, vaapi]
    folder: video-editing-workstation
    services: []
    ports: []
    verified: true
  - id: photography-workstation
    name: Photography Workstation
    summary: "A photography workstation: darktable and RawTherapee for RAW processing, ArgyllCMS and DisplayCAL for colour management and display calibration, and gphoto2 for tethered shooting."
    first_boot:
      - "Calibrate your monitor with DisplayCAL (a graphical front end for ArgyllCMS, from a colorimeter) and load the resulting ICC profile in Settings > Color before trusting on-screen colour."
    tags: [photography, raw-processing, darktable, rawtherapee, color-management]
    folder: photography-workstation
    services: []
    ports: []
    verified: true
  - id: cad-3d-printing-workstation
    name: CAD and 3D Printing Workstation
    summary: "A CAD and 3D printing workstation on Debian trixie: FreeCAD and OpenSCAD for modelling and Cura for slicing, with a udev rule already granting the dialout group access to common printer and microcontroller boards."
    first_boot:
      - "If your account is not already in the dialout group (most desktop installs add it automatically), add it yourself: `sudo usermod -aG dialout $USER`, then log out and back in before your printer or board appears without sudo."
    tags: [cad, 3d-printing, freecad, openscad, cura, udev, dialout]
    folder: cad-3d-printing-workstation
    services: []
    ports: []
    verified: true
  - id: data-science-workstation
    name: Data Science Workstation
    summary: "A data science workstation: the developer profile plus the Python scientific stack (NumPy, SciPy, pandas, scikit-learn, Matplotlib, seaborn) and a Jupyter Notebook launcher already on the applications menu."
    first_boot:
      - "Open \"Jupyter Notebook\" from the applications menu, or run `jupyter-notebook` yourself; it starts in your home directory."
    tags: [data-science, python, jupyter, numpy, pandas, scikit-learn]
    folder: data-science-workstation
    services: []
    ports: []
    verified: true
  - id: security-research-workstation
    name: Security Research Workstation
    summary: "A security research workstation for lawful, authorised network and web analysis: nmap, Wireshark, tcpdump, aircrack-ng, sqlmap, Nikto, Hydra, John the Ripper, Hashcat, Gobuster, WhatWeb and dirb, with a pcap group already granted non-root packet capture."
    first_boot:
      - "Add your account to the pcap group so packet capture needs no sudo — `sudo usermod -aG pcap $USER` — then log out and back in before opening Wireshark or running tcpdump."
    tags: [security-research, penetration-testing, network-analysis, wireshark, nmap, packet-capture]
    folder: security-research-workstation
    services: []
    ports: []
    verified: true
  - id: digital-signage
    name: Digital Signage
    summary: "A kiosk that boots straight into a full-screen browser showing one URL, set in a single configuration file."
    first_boot:
      - "Edit /etc/firefox/policies/policies.json and change the Homepage URL to your sign's page, then restart the browser (or reboot)."
    tags: [digital-signage, kiosk, browser, display]
    folder: digital-signage
    services: []
    ports: []
    verified: true
  - id: retro-gaming-console
    name: Retro Gaming Console
    summary: "A console-style kiosk that boots straight into RetroArch, with joystick and gamepad autodetection and six libretro cores already installed (SNES, Game Boy Advance, Game Boy, Nintendo DS, NES, PC Engine)."
    first_boot:
      - "No ROMs are shipped (that content is yours to provide lawfully): add them under a content directory of your choice and point RetroArch's playlists at it from its own menu."
    tags: [retro-gaming, retroarch, emulation, kiosk, controller-support]
    folder: retro-gaming-console
    services: []
    ports: []
    verified: true
  - id: classroom-workstation
    name: Classroom / Shared-Desk Workstation
    summary: "A locked-down workstation for a school or library: no command line, no user administration, a short auto screen-lock, and USBGuard blocking any USB device beyond keyboards, mice and hubs until an administrator allows it."
    first_boot:
      - "USBGuard already blocks anything beyond keyboards, mice and hubs: plug in and allow a device this room genuinely needs as an administrator (`sudo usbguard allow-device <id>`) before handing the machine to the next person."
    tags: [classroom, shared-desk, lockdown, usbguard, education, library]
    folder: classroom-workstation
    services: []
    ports: []
    verified: true
  - id: home-automation
    name: Home Automation
    summary: "A Home Assistant server for home automation and device integrations, its configuration kept on its own volume."
    first_boot:
      - "Port 8123 stays closed by default: Home Assistant's own onboarding wizard, which creates the first (administrator) account, is open to whoever reaches it first. Tunnel in first (`ssh -L 8123:localhost:8123 you@host`), finish onboarding at http://localhost:8123/, then open 8123 yourself (`sudo ufw allow 8123/tcp`)."
    tags: [home-assistant, home-automation, iot, smart-home]
    folder: home-automation
    services: [homeassistant]
    ports: [22]
    verified: true
  - id: ad-blocking
    name: Ad and Tracker Blocking (Pi-hole)
    summary: "Pi-hole answering DNS on port 53 for the whole network, blocking ads and trackers before they ever load."
    first_boot:
      - "This appliance disables systemd-resolved's own DNS stub listener (/etc/systemd/resolved.conf.d/pihole-no-stub.conf sets DNSStubListener=no) so Pi-hole can bind port 53 itself; that also silences the resolver most desktops read through /etc/resolv.conf (127.0.0.53), so repoint it once at systemd-resolved's real, non-stub file: `sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf`."
      - "The web UI (port 80) stays closed by default. Pi-hole itself generates a random admin password at first start and prints it only to the container's own log — never a password this profile ships — so read it with `sudo podman logs pihole` (or `sudo journalctl -u pihole`)."
      - "Or tunnel in (`ssh -L 8080:localhost:80 you@host`) and set your own with `pihole -a -p`, then open port 80 yourself if you want it reachable directly."
    tags: [pihole, dns, ad-blocking, privacy, network]
    folder: ad-blocking
    services: [pihole]
    ports: [22, 53]
    verified: true
  - id: personal-cloud
    name: Personal Cloud
    summary: "A Nextcloud personal cloud for files, contacts and calendars, in its simplest working shape: SQLite, no separate database to configure."
    first_boot:
      - "Port 80 stays closed by default: Nextcloud's own setup wizard, which creates the first (administrator) account, is open to whoever reaches it first. Tunnel in first (`ssh -L 8080:localhost:80 you@host`), finish the wizard at http://localhost:8080/, then open 80 yourself (`sudo ufw allow 80/tcp`)."
    tags: [nextcloud, personal-cloud, file-sharing, groupware]
    folder: personal-cloud
    services: [nextcloud]
    ports: [22]
    verified: true
  - id: password-manager
    name: Password Manager
    summary: "A Vaultwarden password manager, compatible with Bitwarden's own clients, with sign-ups disabled until you turn them on."
    first_boot:
      - "This must sit behind TLS before it is exposed: every Bitwarden-compatible client refuses a server that is not HTTPS, so put this appliance's port 80 behind this catalog's Nginx, Apache or Caddy TLS reverse proxy — never open it to the outside as plain HTTP."
      - "Sign-ups are disabled by default (SIGNUPS_ALLOWED=false). Reach it locally or over a tunnel (`ssh -L 8080:localhost:80 you@host`), turn SIGNUPS_ALLOWED on for just long enough to create your own account, then turn it back off."
    tags: [vaultwarden, bitwarden, password-manager, security]
    folder: password-manager
    services: [vaultwarden]
    ports: [22]
    verified: true
  - id: container-management
    name: Container Management
    summary: "Portainer managing this machine's own containers through a web UI on port 9443."
    first_boot:
      - "Enable the Podman API socket once before starting the portainer service: `sudo systemctl enable --now podman.socket`."
      - "Port 9443 stays closed by default: Portainer prints a random one-time setup token to its own log at first start, and the admin account cannot be created without it."
      - "Tunnel in (`ssh -L 9443:localhost:9443 you@host`), read the token from the container's log, create the account at https://localhost:9443/ (a self-signed certificate warning is expected), then open 9443 yourself (`sudo ufw allow 9443/tcp`)."
    tags: [portainer, containers, management, podman]
    folder: container-management
    services: [portainer]
    ports: [22]
    verified: true
  - id: status-monitoring
    name: Status Monitoring
    summary: "Uptime Kuma watching other hosts and services and reporting their status on port 3001."
    first_boot:
      - "Port 3001 stays closed by default: Uptime Kuma's own setup screen, which creates the one admin account, is open to whoever reaches it first. Tunnel in first (`ssh -L 3001:localhost:3001 you@host`), create that account at http://localhost:3001/, then open 3001 yourself (`sudo ufw allow 3001/tcp`)."
    tags: [uptime-kuma, monitoring, status-page, alerts]
    folder: status-monitoring
    services: [uptime-kuma]
    ports: [22]
    verified: true
  - id: file-sync
    name: File Synchronisation
    summary: "Syncthing keeping folders in sync across your own devices over its own peer-to-peer protocol."
    first_boot:
      - "The sync protocol (port 22000, TCP and UDP) and local discovery (port 21027/UDP) are open by default; pairing a device still needs that device's own ID, so nothing is reachable without one."
      - "The web GUI (port 8384) ships with no username or password at all, so it stays closed by default. Tunnel in (`ssh -L 8384:localhost:8384 you@host`), set a GUI username and password (Settings > GUI), then open 8384 yourself (`sudo ufw allow 8384/tcp`) if you want it reachable directly."
    tags: [syncthing, file-sync, peer-to-peer, backup]
    folder: file-sync
    services: [syncthing]
    ports: [22, 22000, 21027]
    verified: true
  - id: object-storage
    name: Object Storage
    summary: "MinIO providing S3-compatible object storage, its API on port 9000 and its console on port 9001."
    first_boot:
      - "It fails to start until you create /etc/minio/credentials, a file this profile deliberately does not ship: `printf 'MINIO_ROOT_USER=%s\\nMINIO_ROOT_PASSWORD=%s\\n' 'a-real-username' 'a-real-password' | sudo tee /etc/minio/credentials >/dev/null && sudo chmod 600 /etc/minio/credentials && sudo systemctl restart minio`."
      - "Open ports 9000 and 9001 yourself once real values are set (`sudo ufw allow 9000/tcp && sudo ufw allow 9001/tcp`)."
    tags: [minio, object-storage, s3, storage]
    folder: object-storage
    services: [minio]
    ports: [22]
    verified: true
  - id: automation-flows
    name: Automation Flows
    summary: "An n8n workflow automation server on port 5678, with a large library of ready integrations."
    first_boot:
      - "Port 5678 stays closed by default: n8n's own setup screen, which creates the first (owner) account, is open to whoever reaches it first. Tunnel in first (`ssh -L 5678:localhost:5678 you@host`), create that account at http://localhost:5678/, then open 5678 yourself (`sudo ufw allow 5678/tcp`)."
    tags: [n8n, automation, workflows, integrations]
    folder: automation-flows
    services: [n8n]
    ports: [22]
    verified: true
  - id: vpn-server
    name: VPN Server
    summary: "A WireGuard VPN server (wg-easy) with a web UI for managing peers."
    first_boot:
      - "Replace the placeholder WG_HOST (192.0.2.1, a documentation-only address) with this machine's real public IP or hostname before generating any client config — every QR code and .conf file otherwise points nowhere."
      - "Port 51821 (the web UI) stays closed by default: wg-easy's own setup wizard lets whoever opens it first create the admin account. Tunnel in first (`ssh -L 51821:localhost:51821 you@host`), finish setup at http://localhost:51821/, then open 51821 yourself (`sudo ufw allow 51821/tcp`) if you want to manage peers without a tunnel."
    tags: [wireguard, vpn, wg-easy, networking]
    folder: vpn-server
    services: [wg-easy]
    ports: [22, 51820]
    verified: true
  - id: clickhouse-server
    name: ClickHouse Analytics Database
    summary: "ClickHouse, a column-oriented SQL database built for fast analytics over huge tables, serving HTTP on port 8123 and its native protocol on port 9000; give it plenty of RAM once real data lands."
    first_boot:
      - "ClickHouse ships with no password, and its own entrypoint responds to that by restricting the default user to the container's own loopback interface: nothing on the network can query it yet."
      - "Tunnel in (`ssh -L 8123:localhost:8123 you@host`), give it a real password (`printf '%s' 'a-real-password' | sudo tee /etc/clickhouse/password >/dev/null && sudo chmod 600 /etc/clickhouse/password && sudo systemctl restart clickhouse`), then open ports 8123 and 9000 yourself once that password is something private of your own."
    tags: [clickhouse, olap, analytics, column-store, sql, database]
    folder: clickhouse-server
    services: [clickhouse]
    ports: [22]
    verified: true
  - id: influxdb-server
    name: InfluxDB Time-Series Database
    summary: "InfluxDB, a time-series database with an HTTP API and browser UI on port 8086, for metrics and other time-stamped data."
    first_boot:
      - "It fails to start until you create its admin password file: `printf '%s' 'a-real-password' | sudo tee /etc/influxdb/admin-password >/dev/null && sudo chmod 600 /etc/influxdb/admin-password && sudo systemctl restart influxdb`."
      - "Open port 8086 yourself once that password is set to something private of your own; the initial organisation is synos and the initial bucket is metrics."
    tags: [influxdb, time-series, metrics, database]
    folder: influxdb-server
    services: [influxdb]
    ports: [22]
    verified: true
  - id: cassandra-server
    name: Cassandra Wide-Column Store
    summary: "Apache Cassandra, a wide-column store built to scale out, started here as a single node on CQL port 9042 that can grow into a real cluster; wants several GB of heap even alone."
    first_boot:
      - "Cassandra's default authenticator accepts every connection with no login at all, so port 9042 stays closed until you turn authentication on yourself."
      - "Tunnel in (`ssh -L 9042:localhost:9042 you@host`), then enable password authentication and restart: `sudo podman exec cassandra sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml && sudo systemctl restart cassandra`."
      - "Log in with Cassandra's own default superuser and change it immediately: `sudo podman exec -it cassandra cqlsh -u cassandra -p cassandra -e \"ALTER USER cassandra WITH PASSWORD 'a-real-password';\"`, then open port 9042 yourself."
    tags: [cassandra, wide-column, nosql, database, cluster]
    folder: cassandra-server
    services: [cassandra]
    ports: [22]
    verified: true
  - id: cockroachdb-server
    name: CockroachDB Distributed SQL
    summary: "CockroachDB, a distributed SQL database that speaks the PostgreSQL wire protocol and dialect, started here as a single node (SQL on port 26257, admin UI on 8080) that can grow into a cluster."
    first_boot:
      - "CockroachDB starts in its normal secure mode: it generates its own certificate authority and certificates inside the container on first boot, and nobody outside can authenticate yet — root only holds a certificate, no other user has a password."
      - "Tunnel in (`ssh -L 26257:localhost:26257 you@host`), then create a real user from inside the container: `sudo podman exec -it cockroach cockroach sql --certs-dir=/cockroach/certs -e \"CREATE USER appuser WITH PASSWORD 'a-real-password';\"`."
      - "Open port 26257 (and 8080 for the admin UI, which asks that user to log in) yourself once that password is something private of your own."
    tags: [cockroachdb, distributed-sql, postgresql-compatible, database, cluster]
    folder: cockroachdb-server
    services: [cockroach]
    ports: [22]
    verified: true
  - id: couchdb-server
