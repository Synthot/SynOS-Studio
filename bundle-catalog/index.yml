# The bundle catalog: ready-made bundles a person can start from instead of
# starting from scratch (docs/BUNDLE.md, "The bundle catalog"). Each entry
# names one folder here; tools/export_catalog.py reads the folder's files and
# exports them verbatim as bundle_catalog[].files. Every entry here ships with
# the engine, so verified is true and contributed_by is omitted throughout;
# a community-proposed entry would set both (see docs/BUNDLE.md).
#
# summary: one sentence, no commands, no "first boot" clause — what the
# machine is and what it runs, the way a catalogue entry reads. first_boot:
# the steps a person does first, one short string per step (a command may
# appear inside a step); [] when there is no meaningful first step rather
# than invented filler.
bundle_catalog:
  - id: yocto-builder
    name: Yocto Build Machine
    summary: "The everyday Yocto/OpenEmbedded build host: BitBake's required host packages plus practical build tools (rsync, ccache, a lean QEMU for runqemu), needing an en_US.UTF-8 locale and at least 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, cross-compile, build-host]
    folder: yocto-builder
    services: []
    ports: []
    verified: true
  - id: yocto-builder-docs
    name: Yocto Build Machine, full
    summary: "The larger Yocto/OpenEmbedded build host that also builds the Yocto Project's own documentation, including PDFs: everything the lean build host has, plus LaTeX and a full font set, needing well over 140 GB free disk space."
    first_boot: []
    tags: [yocto, openembedded, bitbake, embedded, documentation, latex, build-host]
    folder: yocto-builder-docs
    services: []
    ports: []
    verified: true
  - id: ai-workstation
    name: AI Workstation
    summary: "A developer workstation with PyTorch and llama.cpp for local model work; the GPU compute stack and inference services (Ollama, Open WebUI, vLLM) are chosen when this bundle is opened."
    first_boot: []
    tags: [ai, machine-learning, pytorch, llama.cpp, gpu, local-inference]
    folder: ai-workstation
    services: []
    ports: []
    verified: true
  - id: kodi-media-centre
    name: Kodi Media Centre
    summary: "A kiosk that boots straight into Kodi, with remote/CEC and joystick support already installed."
    first_boot:
      - "Point Kodi at your media library (Settings > Media > Library)."
      - "Kodi's own web interface is off by default; if you turn it on, set a password for it there before opening its port yourself."
    tags: [kodi, media-center, home-theater, kiosk, hdmi-cec, remote-control]
    folder: kodi-media-centre
    services: []
    ports: []
    verified: true
  - id: web-server-nginx
    name: Web Server (Nginx)
    summary: "Nginx serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the leanest and fastest of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/nginx/certs to enable the commented-out TLS block in /etc/nginx/conf.d/site.conf."
    tags: [nginx, web-server, reverse-proxy, http, tls]
    folder: web-server-nginx
    services: [nginx]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-apache
    name: Web Server (Apache)
    summary: "Apache httpd serving a placeholder page on ports 80 and 443, ready as a reverse proxy — the traditional, most broadly documented and module-rich of the three web server appliances."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Put your certificate and key in /etc/apache/certs to enable the commented-out TLS block in /etc/apache/httpd.conf."
    tags: [apache, httpd, web-server, reverse-proxy, http, tls]
    folder: web-server-apache
    services: [apache]
    ports: [22, 80, 443]
    verified: true
  - id: web-server-caddy
    name: Web Server (Caddy)
    summary: "Caddy serving a placeholder page on ports 80 and 443 — distinguished from the other two web server appliances by automatic HTTPS."
    first_boot:
      - "Replace /srv/www/index.html with your site."
      - "Replace \":80\" in /etc/caddy/Caddyfile with your real domain name — Caddy obtains and renews its certificate for you."
    tags: [caddy, web-server, https, acme, automatic-tls]
    folder: web-server-caddy
    services: [caddy]
    ports: [22, 80, 443]
    verified: true
  - id: container-registry
    name: Container Registry
    summary: "An OCI/Docker image registry on port 5000 with HTTP basic authentication already configured and storage on its own volume."
    first_boot:
      - "The shipped htpasswd file is a placeholder that matches no real password, so every login is refused until you replace it: `htpasswd -Bc /etc/registry/htpasswd <user>`, then restart the registry service, before pushing images."
    tags: [registry, oci, docker, container-images, ci-cd]
    folder: container-registry
    services: [registry]
    ports: [22, 5000]
    verified: true
  - id: git-server
    name: Git Server
    summary: "Self-hosted Git (Gitea) with a web UI, issues and pull requests, and git over SSH on port 2222."
    first_boot:
      - "Git over SSH (port 2222) is open from the start — it accepts nothing until an account with a registered key exists."
      - "The web UI's port 3000 stays closed by default, since whoever reaches it first would register the first account and Gitea makes it an administrator: tunnel in first (`ssh -L 3000:localhost:3000 you@host`), register that account at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [git, gitea, version-control, code-review, ci-cd]
    folder: git-server
    services: [gitea]
    ports: [22, 2222]
    verified: true
  - id: media-server
    name: Media Server
    summary: "A Jellyfin media server pointed at /srv/media for your video and music library."
    first_boot:
      - "Port 8096 stays closed by default, since Jellyfin's own setup wizard (which creates the admin account) is open to whoever reaches it first: tunnel in first (`ssh -L 8096:localhost:8096 you@host`), finish the wizard at http://localhost:8096/, then open 8096 yourself (`sudo ufw allow 8096/tcp`)."
    tags: [jellyfin, media-server, streaming, movies, music]
    folder: media-server
    services: [jellyfin]
    ports: [22]
    verified: true
  - id: monitoring-server
    name: Monitoring Server
    summary: "Prometheus and Grafana as system services, Grafana already pointed at Prometheus as its default data source."
    first_boot:
      - "Prometheus (port 9090) is open by default — nothing to sign into."
      - "Grafana's port 3000 stays closed by default: it signs in as admin/admin until changed, so whoever reaches it first owns it. Tunnel in first (`ssh -L 3000:localhost:3000 you@host`), sign in and set a real password at http://localhost:3000/, then open 3000 yourself (`sudo ufw allow 3000/tcp`)."
    tags: [monitoring, prometheus, grafana, metrics, dashboards, observability]
    folder: monitoring-server
    services: [prometheus, grafana]
    ports: [22, 9090]
    verified: true
  - id: database-server
    name: Database Server
    summary: "PostgreSQL as a system service, its superuser password read from a file this profile deliberately does not ship."
    first_boot:
      - "It fails to start until you create that password file: `printf '%s' 'a-real-password' | sudo tee /etc/postgres/superuser-password >/dev/null && sudo chmod 600 /etc/postgres/superuser-password && sudo systemctl restart postgres`."
      - "Open port 5432 yourself (`sudo ufw allow 5432/tcp`) once that password is set to something private of your own."
    tags: [postgresql, database, sql, postgres]
    folder: database-server
    services: [postgres]
    ports: [22]
    verified: true
  - id: kubernetes-server
    name: Kubernetes Server
    summary: "A single-node Kubernetes control plane (kubeadm, kubelet, kubectl, containerd) from the community pkgs.k8s.io repository pinned to v1.31, with the kernel modules and sysctl settings a node needs already in place."
    first_boot:
      - "Only the API server (6443) and the kubelet API (10250) are opened by default; etcd (2379-2380/tcp) and the NodePort range (30000-32767/tcp) stay closed until you add nodes or expose a service that way."
      - "Fix containerd's cgroup driver and initialise the cluster: `containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | sudo tee /etc/containerd/config.toml >/dev/null && sudo systemctl restart containerd && sudo kubeadm init --pod-network-cidr=10.244.0.0/16`."
      - "Install a CNI plugin."
    tags: [kubernetes, k8s, kubeadm, container-orchestration, cluster]
    folder: kubernetes-server
    services: []
    ports: [22, 6443, 10250]
    verified: true
  - id: event-streaming
    name: Event Streaming (Kafka)
    summary: "A single-broker Apache Kafka cluster running in KRaft mode as a system service — no separate ZooKeeper ensemble to run or lose quorum in."
    first_boot:
      - "Port 9092 stays closed by default: a fresh broker accepts any client with no authentication configured, so whoever reaches it first can create, read or delete any topic."
      - "Reach it over an SSH tunnel first (`ssh -L 9092:localhost:9092 you@host`) to try it, then put real authentication (SASL or mTLS) in front of it before opening the port yourself (`sudo ufw allow 9092/tcp`)."
    tags: [kafka, event-streaming, messaging, kraft, streaming]
    folder: event-streaming
    services: [kafka]
    ports: [22]
    verified: true

  - id: stream-processing
    name: Stream Processing (Flink)
    summary: "An Apache Flink job manager and task manager running as system services, ready to accept a submitted job."
    first_boot:
      - "The web UI and REST API (8081) can submit and cancel arbitrary jobs with no authentication configured, so it stays closed by default: tunnel in first (`ssh -L 8081:localhost:8081 you@host`)."
      - "Submit a job over that tunnel (`flink run -m localhost:8081 your-job.jar`) or with the web UI, then open the port yourself (`sudo ufw allow 8081/tcp`) once you trust who can reach it."
    tags: [flink, stream-processing, batch-processing, streaming, data-pipeline]
    folder: stream-processing
    services: [jobmanager, taskmanager]
    ports: [22]
    verified: true

  - id: cluster-coordination
    name: Cluster Coordination (ZooKeeper)
    summary: "An Apache ZooKeeper ensemble running as a system service, for people who still need one for an older stack — Kafka itself has not needed ZooKeeper since it grew its own KRaft mode."
    first_boot:
      - "Port 2181 stays closed by default: a fresh ensemble accepts any client with no authentication or ACLs configured at all, so whoever reaches it first can read or rewrite every znode."
      - "Reach it over an SSH tunnel first (`ssh -L 2181:localhost:2181 you@host`), put authentication (SASL digest or Kerberos) in front of it, then open the port yourself (`sudo ufw allow 2181/tcp`)."
    tags: [zookeeper, cluster-coordination, distributed-systems, consensus]
    folder: cluster-coordination
    services: [zookeeper]
    ports: [22]
    verified: true

  - id: identity-sso
    name: Identity and Single Sign-On (Keycloak)
    summary: "Keycloak running as a system service for identity and single sign-on, in its start-dev mode with the embedded database it ships with."
    first_boot:
      - "No admin account exists yet: reach it only over an SSH tunnel first (`ssh -L 8080:localhost:8080 you@host`)."
      - "Bootstrap one, once: `sudo systemctl edit keycloak`, add under `[Service]` both `Environment=KC_BOOTSTRAP_ADMIN_USERNAME=youradmin` and `Environment=KC_BOOTSTRAP_ADMIN_PASSWORD=a-real-password`, then `sudo systemctl restart keycloak` — Keycloak creates that account once and ignores the variables afterward."
      - "Remove the override so the password does not linger in a unit file (`sudo systemctl edit keycloak` again, delete those lines, `sudo systemctl daemon-reload`), sign in at http://localhost:8080/, then open the port yourself (`sudo ufw allow 8080/tcp`)."
    tags: [keycloak, identity, single-sign-on, oauth, oidc, saml]
    folder: identity-sso
    services: [keycloak]
    ports: [22]
    verified: true

  - id: secret-manager
    name: Secret Manager (OpenBao)
    summary: "OpenBao running as a system service: the open-source fork of HashiCorp Vault, kept after Vault's licence changed to the Business Source Licence."
    first_boot:
      - "It ships sealed and completely uninitialised — no unseal key and no root token exist anywhere in this repository or the image — so reach it only over an SSH tunnel first (`ssh -L 8200:localhost:8200 you@host`)."
      - "Initialise it there, once (`docker exec -it openbao bao operator init`), and save the unseal key and the root token it prints somewhere safe: OpenBao never shows them again."
      - "Unseal it with that key (`bao operator unseal`), sign in with the root token, and put a TLS-terminating proxy in front of it (this catalog's own edge-proxy, or your own) before opening the port yourself (`sudo ufw allow 8200/tcp`) — it ships with TLS disabled for simplicity, so anything sent to it beyond your own tunnel travels in the clear otherwise."
    tags: [openbao, secret-manager, vault, secrets, encryption]
    folder: secret-manager
    services: [openbao]
    ports: [22]
    verified: true

  - id: edge-proxy
    name: Edge Proxy and Load Balancer (Envoy)
    summary: "Envoy running as a system service, an edge proxy and load balancer serving a placeholder response on port 10000 until real clusters and routes are added."
    first_boot:
      - "Edit /etc/envoy/envoy.yaml to add your own listeners, clusters and routes, then restart the envoy service."
    tags: [envoy, edge-proxy, load-balancer, reverse-proxy, service-mesh]
    folder: edge-proxy
    services: [envoy]
    ports: [22, 10000]
    verified: true

  - id: authoritative-dns
    name: Authoritative DNS (PowerDNS)
    summary: "PowerDNS Authoritative Server running as a system service, answering for a placeholder zone over plain DNS; its zone-editing HTTP API ships turned off."
    first_boot:
      - "Replace the placeholder zone (/etc/powerdns/example.com.zone and /etc/powerdns/named.conf) with your own, then restart the pdns service."
      - "The HTTP API is off by default (api=no in /etc/powerdns/pdns.conf), since any key shipped in this public repository would already be known to everyone: turn it on and set your own key locally, then open its port yourself if you need it reachable."
    tags: [powerdns, dns, authoritative-dns, nameserver]
    folder: authoritative-dns
    services: [pdns]
    ports: [22, 53]
    verified: true

  - id: distributed-compute
    name: Distributed Compute (Ray)
    summary: "A Ray head node running as a system service for distributed Python and machine-learning workloads, its dashboard included."
    first_boot:
      - "The dashboard, the Ray Client server and the head node's own port (8265, 10001, 6379) all accept and run arbitrary code with no authentication configured at all, so every one of them stays closed by default."
      - "Reach the dashboard over an SSH tunnel first (`ssh -L 8265:localhost:8265 you@host`), and open only the ports worker nodes on your own trusted network actually need (`sudo ufw allow 6379/tcp`, and so on)."
    tags: [ray, distributed-compute, machine-learning, python, cluster-computing]
    folder: distributed-compute
    services: [ray-head]
    ports: [22]
    verified: true

  - id: devops-platform
    name: DevOps Platform (GitLab)
    summary: "Self-hosted GitLab Community Edition as a system service — never Enterprise Edition, which needs a paid licence. It is heavy: at least 8 GB memory (16 GB is GitLab's own baseline) and about 40 GB disk for the application alone, before repositories or a growing database."
    first_boot:
      - "Git over SSH (port 2222) is open from the start — cloning or pushing needs a registered account and key, and none exists yet."
      - "The web UI (80/443) stays closed by default: GitLab writes a random root password inside the container on first start, valid only 24 hours. Tunnel in first (`ssh -L 8080:localhost:80 you@host`), read it (`docker exec gitlab cat /etc/gitlab/initial_root_password`), sign in as root at http://localhost:8080/, and set a real password."
      - "Public sign-up ships on (GitLab's own default): turn it off in the admin area (Settings > General > Sign-up restrictions) while you are in there, unless you want it."
      - "Then open the web ports yourself (`sudo ufw allow 80/tcp && sudo ufw allow 443/tcp`)."
    tags: [gitlab, devops-platform, version-control, ci-cd, code-review]
    folder: devops-platform
    services: [gitlab]
    ports: [22, 2222]
    verified: true
