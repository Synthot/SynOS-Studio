  - id: identity-sso
    name: Identity and Single Sign-On (Keycloak)
    summary: "Keycloak running as a system service for identity and single sign-on, in its start-dev mode with the embedded database it ships with."
    first_boot:
      - "No admin account exists yet: reach it only over an SSH tunnel first (`ssh -L 8080:localhost:8080 you@host`)."
      - "Bootstrap one, once: `sudo systemctl edit keycloak`, add under `[Service]` both `Environment=KC_BOOTSTRAP_ADMIN_USERNAME=youradmin` and `Environment=KC_BOOTSTRAP_ADMIN_PASSWORD=a-real-password`, then `sudo systemctl restart keycloak` — Keycloak creates that account once and ignores the variables afterward."
      - "Remove the override so the password does not linger in a unit file (`sudo systemctl edit keycloak` again, delete those lines, `sudo systemctl daemon-reload`), sign in at http://localhost:8080/, then open the port yourself (`sudo ufw allow 8080/tcp`)."
    tags: [keycloak, identity, single-sign-on, oauth, oidc, saml]
    folder: identity-sso
    services: [keycloak]
    ports: [22]
    verified: true

  - id: secret-manager
    name: Secret Manager (OpenBao)
    summary: "OpenBao running as a system service: the open-source fork of HashiCorp Vault, kept after Vault's licence changed to the Business Source Licence."
    first_boot:
      - "It ships sealed and completely uninitialised — no unseal key and no root token exist anywhere in this repository or the image — so reach it only over an SSH tunnel first (`ssh -L 8200:localhost:8200 you@host`)."
      - "Initialise it there, once (`sudo podman exec -it openbao bao operator init`), and save the unseal key and the root token it prints somewhere safe: OpenBao never shows them again."
      - "Unseal it with that key (`bao operator unseal`), sign in with the root token, and put a TLS-terminating proxy in front of it (this catalog's own edge-proxy, or your own) before opening the port yourself (`sudo ufw allow 8200/tcp`) — it ships with TLS disabled for simplicity, so anything sent to it beyond your own tunnel travels in the clear otherwise."
    tags: [openbao, secret-manager, vault, secrets, encryption]
    folder: secret-manager
    services: [openbao]
    ports: [22]
    verified: true

