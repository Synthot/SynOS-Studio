id: kubernetes-server
extends: server
description: >-
  Server profile for a single-node Kubernetes control plane that can grow:
  kubeadm, kubelet and kubectl from the community pkgs.k8s.io repository
  pinned to v1.31, containerd as the container runtime from this base's
  own archive, and the kernel modules, sysctl settings and firewall ports
  a node needs already in place.
software:
  repositories:
    - name: kubernetes
      url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/
      suite: "/"
      key: keys/kubernetes.asc
      packages: [kubelet, kubeadm, kubectl, cri-tools]
  packages:
    add: [containerd, runc]
  files:
    - path: /etc/modules-load.d/k8s.conf
      content: |
        overlay
        br_netfilter
    - path: /etc/sysctl.d/k8s.conf
      content: |
        net.bridge.bridge-nf-call-iptables  = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward                 = 1
security:
  open_ports: [22/tcp, 6443/tcp, 2379/tcp, 2380/tcp, 10250/tcp, 10251/tcp, 10252/tcp, 10257/tcp, 10259/tcp]
