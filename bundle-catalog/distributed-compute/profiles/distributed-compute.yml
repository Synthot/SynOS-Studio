id: distributed-compute
extends: server
description: >-
  Server profile running a Ray head node as a system service for
  distributed Python and machine-learning workloads, its dashboard
  enabled on 8265. The dashboard, the Ray Client server (10001) and the
  head node's own port (6379) all accept and run arbitrary code with no
  authentication configured at all, so every one of them stays closed
  by default rather than just the dashboard.
software:
  services:
    - name: ray-head
      image: docker.io/rayproject/ray:2.58.0-py311-cpu
      ports: ["6379:6379", "8265:8265", "10001:10001"]
      volumes:
        - ray-data:/tmp/ray
      exec: "ray start --head --dashboard-host=0.0.0.0 --port=6379 --block"
security:
  open_ports: [22/tcp]
