id: object-storage
extends: server
description: >-
  Server profile running MinIO as a system service: S3-compatible object
  storage, its API on port 9000 and its browser console on port 9001.
  MinIO has no "refuse to start without a secret" mode and no working
  file-based secret injection in this release (checked by hand: neither
  MINIO_ROOT_USER_FILE nor MINIO_ROOT_PASSWORD_FILE actually took effect
  in this image, so this profile does not rely on them) — leave
  MINIO_ROOT_USER and MINIO_ROOT_PASSWORD unset and it silently starts
  with the well-known default minioadmin:minioadmin instead. This profile
  ships neither variable, on purpose, and keeps both ports closed by
  default so that default credential is never reachable from outside
  this machine.
software:
  services:
    - name: minio
      image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
      ports: ["9000:9000", "9001:9001"]
      volumes:
        - minio-data:/data
      exec: "server /data --console-address :9001"
security:
  open_ports: [22/tcp]
