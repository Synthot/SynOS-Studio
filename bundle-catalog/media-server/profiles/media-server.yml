id: media-server
extends: server
description: >-
  Server profile running Jellyfin as a system service, pointed at
  /srv/media: drop a video and music library there and Jellyfin finds
  it. Port 8096 stays closed by default: Jellyfin's own setup wizard,
  which creates the admin account, is open to whoever reaches it first.
software:
  services:
    - name: jellyfin
      image: docker.io/jellyfin/jellyfin:12.1
      ports: ["8096:8096"]
      volumes:
        - jellyfin-config:/config
        - jellyfin-cache:/cache
        - /srv/media:/media
security:
  open_ports: [22/tcp]
